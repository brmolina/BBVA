<template>
    <div class="slds-box slds-theme_default">
        <article class="slds-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:approval" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <p class="slds-truncate" title="Approvers Info">
                                <span>Approvers Info</span>
                            </p>
                        </h2>
                    </div>
                </header>
            </div>

            <div class="slds-card__body slds-card__body_inner">

                <!-- Spinner: visible mientras se procesa el save -->
                <template if:true={isSaving}>
                    <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
                </template>

                <!-- ══════════════════════════════════════════════
                     MODO LECTURA — lightning-record-view-form
                ══════════════════════════════════════════════ -->
                <template if:true={isReadOnly}>
                    <lightning-record-view-form
                        record-id={recordId}
                        object-api-name="Opportunity"
                    >
                        <div class="slds-form" role="list">
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_Booking_Unit_Risk_Analyst__c"
                                            lwc:ref="DMT_Booking_Unit_Risk_Analyst__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon onclick={handleEdit} icon-name="utility:edit"
                                                variant="bare" alternative-text="Edit" title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                                <!-- Global Banker: siempre read-only, sin lápiz -->
                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_GlobalBanker__c"
                                            lwc:ref="DMT_GlobalBanker__c">
                                        </lightning-output-field>
                                    </div>
                                </div>

                            </div>
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_Approver__c"
                                            lwc:ref="DMT_Approver__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                alternative-text="Edit" onclick={handleEdit} title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_ApproverGlobalBanker__c"
                                            lwc:ref="DMT_ApproverGlobalBanker__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                alternative-text="Edit" onclick={handleEdit} title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                            </div>
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_Financial_Sponsors__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                alternative-text="Edit" onclick={handleEdit} title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                            </div>                        </div>
                    </lightning-record-view-form>
                </template>

                <!-- ══════════════════════════════════════════════
                     MODO EDICIÓN — c-dmt_approverfield (búsqueda por miembro)
                ══════════════════════════════════════════════ -->
                <template if:false={isReadOnly}>
                    <div class="slds-p-around_small slds-p-bottom_xx-large">
                        <lightning-layout multiple-rows="true">

                            <lightning-layout-item size="6" padding="around-small">
                                <c-dmt_approverfield
                                    label="Booking Unit Risk Approver (Local)"
                                    field-api-name="DMT_Booking_Unit_Risk_Analyst__c"
                                    value-id={bookingRiskValueId}
                                    value-name={bookingRiskValueName}
                                    app-entific={entific}
                                    data-field="DMT_Booking_Unit_Risk_Analyst__c"
                                    onchangeedit={handleApproverChange}
                                    onchange={handleApproverClear}>
                                </c-dmt_approverfield>
                            </lightning-layout-item>

                            <!-- Global Banker: siempre read-only, nunca editable -->
                            <lightning-layout-item size="6" padding="around-small">
                                <lightning-record-view-form record-id={recordId} object-api-name="Opportunity">
                                    <lightning-output-field field-name="DMT_GlobalBanker__c">
                                    </lightning-output-field>
                                </lightning-record-view-form>
                            </lightning-layout-item>

                            <lightning-layout-item size="6" padding="around-small">
                                <c-dmt_approverfield
                                    label="Financial Program Risk Approver (Global)"
                                    field-api-name="DMT_Approver__c"
                                    value-id={approverValueId}
                                    value-name={approverValueName}
                                    app-entific={entific}
                                    data-field="DMT_Approver__c"
                                    onchangeedit={handleApproverChange}
                                    onchange={handleApproverClear}>
                                </c-dmt_approverfield>
                            </lightning-layout-item>

                            <lightning-layout-item size="6" padding="around-small">
                                <c-dmt_approverfield
                                    label="Approver Global Banker"
                                    field-api-name="DMT_ApproverGlobalBanker__c"
                                    value-id={approverGBValueId}
                                    value-name={approverGBValueName}
                                    app-entific={entific}
                                    data-field="DMT_ApproverGlobalBanker__c"
                                    onchangeedit={handleApproverChange}
                                    onchange={handleApproverClear}>
                                </c-dmt_approverfield>
                            </lightning-layout-item>

                            <lightning-layout-item size="6" padding="around-small">
                                <lightning-input
                                    type="checkbox"
                                    label="Financial Sponsors"
                                    checked={financialSponsorsValue}
                                    onchange={handleFinancialSponsorsChange}>
                                </lightning-input>
                            </lightning-layout-item>

                        </lightning-layout>
                    </div>
                </template>

            </div>
        </article>
    </div>

    <!-- Sticky footer — solo visible en modo edición standalone -->
    <template lwc:if={showOwnFooter}>
        <div class="slds-docked-form-footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                disabled={isSaving}
                onclick={handleCancel}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Save"
                class="slds-var-m-left_x-small"
                disabled={isSaving}
                onclick={handleSave}>
            </lightning-button>
        </div>
    </template>
</template>
