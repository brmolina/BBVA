<template>
    <div class="slds-box slds-theme_default">
        <article class="slds-card">
            <div class="slds-card__header slds-grid">
                <header class="slds-media slds-media_center slds-has-flexi-truncate">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name="standard:approval" size="small"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <h2 class="slds-card__header-title">
                            <p class="slds-truncate" title="Approvers Info">
                                <span>Approvers Info</span>
                            </p>
                        </h2>
                    </div>
                </header>
            </div>

            <div class="slds-card__body slds-card__body_inner">

                <!-- Spinner: visible mientras se procesa el save -->
                <template if:true={isSaving}>
                    <lightning-spinner alternative-text="Saving..." size="medium"></lightning-spinner>
                </template>

                <!-- ══════════════════════════════════════════════
                     MODO LECTURA — lightning-record-view-form
                ══════════════════════════════════════════════ -->
                <template if:true={isReadOnly}>
                    <lightning-record-view-form
                        record-id={recordId}
                        object-api-name="Opportunity"
                    >
                        <div class="slds-form" role="list">
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_Booking_Unit_Risk_Analyst__c"
                                            lwc:ref="DMT_Booking_Unit_Risk_Analyst__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon onclick={handleEdit} icon-name="utility:edit"
                                                variant="bare" alternative-text="Edit" title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                                <!-- Global Banker: siempre read-only, sin lápiz -->
                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_GlobalBanker__c"
                                            lwc:ref="DMT_GlobalBanker__c">
                                        </lightning-output-field>
                                    </div>
                                </div>

                            </div>
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_Approver__c"
                                            lwc:ref="DMT_Approver__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                alternative-text="Edit" onclick={handleEdit} title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_ApproverGlobalBanker__c"
                                            lwc:ref="DMT_ApproverGlobalBanker__c">
                                        </lightning-output-field>
                                        <template if:true={canEdit}>
                                            <lightning-button-icon icon-name="utility:edit" variant="bare"
                                                alternative-text="Edit" onclick={handleEdit} title="Edit">
                                            </lightning-button-icon>
                                        </template>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </lightning-record-view-form>
                </template>

                <!-- ══════════════════════════════════════════════
                     MODO EDICIÓN — lightning-record-edit-form
                ══════════════════════════════════════════════ -->
                <template if:false={isReadOnly}>
                    <lightning-record-edit-form
                        record-id={recordId}
                        object-api-name="Opportunity"
                        onsuccess={handleSuccess}
                        onerror={handleError}
                    >
                        <lightning-messages></lightning-messages>

                        <div class="slds-form" role="list">
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <lightning-input-field field-name="DMT_Booking_Unit_Risk_Analyst__c"
                                        lwc:ref="DMT_Booking_Unit_Risk_Analyst__c"
                                        onchange={handleChange}>
                                    </lightning-input-field>
                                </div>

                                <!-- Global Banker: siempre output, nunca editable -->
                                <div class="slds-form__item" role="listitem">
                                    <div class="field-row">
                                        <lightning-output-field field-name="DMT_GlobalBanker__c">
                                        </lightning-output-field>
                                    </div>
                                </div>

                            </div>
                            <div class="slds-form__row">

                                <div class="slds-form__item" role="listitem">
                                    <lightning-input-field field-name="DMT_Approver__c"
                                        lwc:ref="DMT_Approver__c"
                                        onchange={handleChange}>
                                    </lightning-input-field>
                                </div>

                                <div class="slds-form__item" role="listitem">
                                    <lightning-input-field field-name="DMT_ApproverGlobalBanker__c"
                                        lwc:ref="DMT_ApproverGlobalBanker__c"
                                        onchange={handleChange}>
                                    </lightning-input-field>
                                </div>

                            </div>
                        </div>

                        <!-- Submit oculto dentro del form — necesario para que onsuccess/onerror funcionen -->
                        <lightning-button
                            type="submit"
                            label="Save"
                            class="slds-hide"
                            lwc:ref="submitBtn"
                        ></lightning-button>

                    </lightning-record-edit-form>
                </template>

            </div>
        </article>
    </div>

    <!-- Sticky footer — solo visible en modo edición -->
    <template if:false={isReadOnly}>
        <div class="slds-docked-form-footer">
            <lightning-button
                variant="neutral"
                label="Cancel"
                disabled={isSaving}
                onclick={handleCancel}>
            </lightning-button>
            <lightning-button
                variant="brand"
                label="Save"
                class="slds-var-m-left_x-small"
                disabled={isSaving}
                onclick={handleSave}>
            </lightning-button>
        </div>
    </template>
</template>
