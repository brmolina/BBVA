<template>
    <lightning-modal-header label="Compare Snapshot Versions">
        
        <div class="slds-grid slds-gutters slds-p-top_small slds-p-horizontal_small">
            <div class="slds-p-left_medium"></div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox 
                    label="Version A (Left)" 
                    value={versionA} 
                    options={optionsA} 
                    onchange={handleVersionAChange}
                    disabled={isLoading}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3">
                <lightning-combobox 
                    label="Version B (Right)" 
                    value={versionB} 
                    options={optionsB} 
                    onchange={handleVersionBChange}
                    disabled={isVersionBDisabled}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-3 slds-align-bottom slds-grid slds-grid_align-center">
                <lightning-input 
                    type="toggle" 
                    label="Show Differences Only" 
                    message-toggle-active=" "   
                    message-toggle-inactive=" "
                    checked={showDifferencesOnly}
                    onchange={handleToggleFilter}
                    disabled={isLoading}>
                </lightning-input>
            </div>
        </div>

        <template lwc:if={hasSections}>
            <div class="slds-grid slds-gutters slds-m-top_medium slds-p-bottom_xx-small">
                <div class="slds-col slds-size_1-of-2">
                    <div class={labelA.class} style="font-weight:700;">
                        {labelA.title}
                    </div>
                    <div class="slds-text-body_small slds-text-color_weak slds-text-align_center">
                        {labelA.subtitle}
                    </div>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <div class={labelB.class} style="font-weight:700;">
                        {labelB.title}
                    </div>
                    <div class="slds-text-body_small slds-text-color_weak slds-text-align_center">
                        {labelB.subtitle}
                    </div>
                </div>
            </div>
        </template>
    </lightning-modal-header>
    
    <lightning-modal-body class="slds-p-around_none modal-body-scroll-fix">
        <div class="content-body">
            
            <template lwc:if={isLoading}>
                <div class="slds-is-relative slds-m-top_large" style="height:100px;">
                    <lightning-spinner alternative-text="Comparing..." size="medium"></lightning-spinner>
                </div>
            </template>

            <div class="slds-m-top_medium" lwc:else>
                
                <template lwc:if={isContentIdentical}>
                    <div class="slds-illustration slds-illustration_small slds-m-top_large">
                        <img src="/img/chatter/OpenRoad.svg" class="slds-illustration__svg" alt=""/>
                        <div class="slds-text-longform">
                            <h3 class="slds-text-heading_medium">Versions are Identical</h3>
                            <p class="slds-text-body_regular slds-m-top_small">
                                Both versions contain the exact same data. They were likely generated by an automated process.
                            </p>
                        </div>
                    </div>
                </template>

                <template lwc:if={isOrderDiffOnly}>
                     <div class="slds-notify slds-notify_alert slds-theme_info slds-m-bottom_medium" role="alert">
                        <h2>Content is identical, but the Section Order has changed.</h2>
                    </div>
                </template>

                <template lwc:if={hasSections}>
                    <template for:each={visibleSections} for:item="section">
                        <div key={section.name} class={section.sectionClass}>
                            
                            <h3 class="slds-section__title">
                                <button aria-controls={section.name} class="slds-button slds-section__title-action" 
                                        data-name={section.name} onclick={handleSectionToggle}>
                                    
                                    <lightning-icon icon-name="utility:switch" size="x-small" 
                                        class="slds-section__title-action-icon slds-button__icon_left"></lightning-icon>
                                    
                                    <span class="slds-truncate" title={section.name}>
                                        <strong>{section.name}</strong>
                                    </span>
                                    
                                    <template lwc:if={section.badgeLabel}>
                                        <span class="slds-m-left_small">
                                            <span class={section.badgeClass}>{section.badgeLabel}</span>
                                        </span>
                                    </template>
                                </button>
                            </h3>

                            <div class="slds-section__content" id={section.name}>
                                <div class="slds-grid slds-gutters slds-p-horizontal_small">
                                    
                                    <div class="slds-col slds-size_1-of-2 slds-border_right">
                                        <template lwc:if={section.isPresentA}>
                                            <template for:each={section.rows} for:item="row">
                                                
                                                <template lwc:if={row.isTitle}>
                                                    <div key={row.text} class={row.class}>{row.text}</div>
                                                </template>

                                                <template lwc:if={row.isField}>
                                                    <div key={row.label} class="slds-grid slds-border_bottom slds-p-vertical_xx-small">
                                                        <div class="slds-col slds-size_1-of-3 slds-text-color_weak slds-truncate" title={row.label}>
                                                            {row.label}
                                                        </div>
                                                        <div class="slds-col slds-size_2-of-3">
                                                            <div class={row.classA}>{row.valA}</div>
                                                        </div>
                                                    </div>
                                                </template>

                                                <template lwc:if={row.isWholeTable}>
                                                    <div key={row.id} class="slds-m-bottom_small">
                                                        <table class="comparison-table">
                                                            <thead>
                                                                <tr>
                                                                    <template for:each={row.headers} for:item="header">
                                                                        <th key={header}>{header}</th>
                                                                    </template>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <template for:each={row.rows} for:item="tblRow">
                                                                    <tr key={tblRow.key}>
                                                                        <template for:each={tblRow.cellsA} for:item="cell">
                                                                            <td key={cell.key}>
                                                                                <div class={cell.class}>
                                                                                    <template lwc:if={cell.value.isTrafficLight}>
                                                                                        <div class="traffic-light-container">
                                                                                            <template for:each={cell.value.lights} for:item="light">
                                                                                                <span key={light.id} class={light.className}></span>
                                                                                            </template>
                                                                                        </div>
                                                                                    </template>
                                                                                    <template lwc:else>
                                                                                        {cell.value}
                                                                                    </template>
                                                                                </div>
                                                                            </td>
                                                                        </template>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </template>

                                            </template>
                                        </template>
                                        </div>

                                    <div class="slds-col slds-size_1-of-2">
                                        <template lwc:if={section.isPresentB}>
                                            <template for:each={section.rows} for:item="row">
                                                
                                                <template lwc:if={row.isTitle}>
                                                    <div key={row.text} class={row.class}>{row.text}</div>
                                                </template>

                                                <template lwc:if={row.isField}>
                                                    <div key={row.label} class="slds-grid slds-border_bottom slds-p-vertical_xx-small">
                                                        <div class="slds-col slds-size_1-of-3 slds-text-color_weak slds-truncate" title={row.label}>
                                                            {row.label}
                                                        </div>
                                                        <div class="slds-col slds-size_2-of-3">
                                                            <div class={row.classB}>{row.valB}</div>
                                                        </div>
                                                    </div>
                                                </template>

                                                <template lwc:if={row.isWholeTable}>
                                                    <div key={row.id} class="slds-m-bottom_small">
                                                        <table class="comparison-table">
                                                            <thead>
                                                                <tr>
                                                                    <template for:each={row.headers} for:item="header">
                                                                        <th key={header}>{header}</th>
                                                                    </template>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                <template for:each={row.rows} for:item="tblRow">
                                                                    <tr key={tblRow.key}>
                                                                        <template for:each={tblRow.cellsB} for:item="cell">
                                                                            <td key={cell.key}>
                                                                                <div class={cell.class}>
                                                                                    <template lwc:if={cell.value.isTrafficLight}>
                                                                                        <div class="traffic-light-container">
                                                                                            <template for:each={cell.value.lights} for:item="light">
                                                                                                <span key={light.id} class={light.className}></span>
                                                                                            </template>
                                                                                        </div>
                                                                                    </template>
                                                                                    <template lwc:else>
                                                                                        {cell.value}
                                                                                    </template>
                                                                                </div>
                                                                            </td>
                                                                        </template>
                                                                    </tr>
                                                                </template>
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </template>

                                            </template>
                                        </template>
                                        </div>

                                </div>
                            </div>
                        </div>
                    </template>
                </template>

                <template lwc:else>
                    <div class="slds-text-align_center slds-p-around_large">
                        Select two versions to begin comparison.
                    </div>
                </template>

            </div>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button label="Close" onclick={handleClose}></lightning-button>
    </lightning-modal-footer>
</template>
