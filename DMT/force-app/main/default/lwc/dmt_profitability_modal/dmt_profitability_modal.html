<template>
    <template if:true={isOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container custom-modal-width">
                <header class="slds-modal__header">
                     <h2 class="slds-text-heading_medium">Profitability Engine</h2>
                </header>
                <div class="slds-modal__content">
                    <c-dmt_profitability_chart></c-dmt_profitability_chart>
                </div>
        
                <footer class="slds-modal__footer">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal}></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <lightning-button label="Open Profitability Engine" onclick={openModal}></lightning-button>
</template>
