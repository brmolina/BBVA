<template>
    <lightning-card>
        <div class="slds-m-around_medium">
            <div class="slds-p-around_xx-small" lwc:if={isOppView}>
                <lightning-button 
                    icon-name="utility:redo"
                    icon-position="right"
                    label={label.DMT_modify_financials_table}
                    aria-haspopup="dialog"
                    variant="base" 
                    onclick={handleRedoAllTable}>
                </lightning-button>
            </div>
            <c-dmt_-table-header-section
                titletable="Business Plan"
                showcopypaste="true"
                rowscopypaste={copyPasteRows}
                tablecolumnscopypaste={copyPasteColumns}
                context="BusinessPlan"
                isreadonlyuser={isCopyPasteDisabled}
                onsendrowsevent={handlePasteData}
            ></c-dmt_-table-header-section> 
            <template lwc:if={isDataProcessed}>
                <div class="slds-table_edit_container">
                    <table aria-describedby="tableDataProcesed" class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_edit slds-table_fixed-layout" role="grid">
                        <thead>
                            <tr class="slds-line-height_reset">
                                <template for:each={columns} for:item="column">
                                    <th key={column.fieldName} class="slds-cell_action-mode slds-is-resizable" scope="col" style="width:100%; height: 100%;">
                                        {column.label}
                                    </th>
                                </template>
                            </tr>
                        </thead>
                        <tbody>
                            <template for:each={processedData} for:item="row">
                                <tr class={row.class} key={row.Id} >
                                    <template for:each={row.values} for:item="cell">
                                        <td  key={cell.field} data-label={cell.label} class={cell.cellClass} role="gridcell">
                                            <div class="slds-grid slds-gutters cell-content">
                                                <template lwc:if={cell.isEditable}>
                                                    <template lwc:if={cell.isEditing}>
                                                        <div class="slds-p-around_none slds-col slds-truncate slds-size_3-of-3 cell-value">
                                                            <input type="number" class="slds-input" value={cell.value} data-id={row.Id} data-field={cell.field} onchange={handleInputChange} />
                                                        </div>
                                                    </template>
                                                    <template lwc:else>
                                                            <div class="slds-col slds-truncate slds-size_2-of-8 cell-value">
                                                                <p>{cell.value}
                                                                    <template lwc:if={isOpportunity}>
                                                                        <template lwc:if={cell.hasComparisonValue}>
                                                                            <span><c-dmt_warning_hover content={cell.accountValue} is-equals={cell.isEquals} object="Client"> </c-dmt_warning_hover></span>
                                                                        </template>
                                                                    </template>
                                                                </p>
                                                            </div>
                                                            <div class="slds-p-around_none slds-col slds-size_1-of-3">
                                                                <template lwc:if={row.isEditable}>
                                                                    <div class="button-group">
                                                                        <template lwc:if={isOpportunity}>
                                                                            <lightning-button-icon icon-name="utility:redo" class="redo-icon no-border" alternative-text="redo" data-id={row.Id} data-field={cell.field} onclick={handleRedo} variant='bare' style={cell.styleRedo}></lightning-button-icon>
                                                                        </template>
                                                                        <template lwc:if={isEditPencilEnabled}>
                                                                            <lightning-button-icon icon-name="utility:edit" class="edit-icon no-border" alternative-text="Edit" data-id={row.Id} data-field={cell.field} onclick={handleEdit} variant='bare'></lightning-button-icon>
                                                                        </template>
                                                                    </div>
                                                                </template>
                                                            </div>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <div class="slds-col slds-truncate slds-size_2-of-8 cell-value">
                                                        <p>{cell.value}
                                                            <template lwc:if={isOpportunity}>
                                                                <template lwc:if={cell.hasComparisonValue}>
                                                                    <span><c-dmt_warning_hover content={cell.accountValue} is-equals={cell.isEquals} object="Client"> </c-dmt_warning_hover></span>
                                                                </template>
                                                            </template>
                                                        </p>
                                                    </div>
                                                    <div class="slds-p-around_none slds-col slds-size_1-of-3">
                                                        <template lwc:if={isOpportunity}>
                                                            <div class="button-group">
                                                                <lightning-button-icon icon-name="utility:redo" class="redo-icon no-border" alternative-text="redo" data-id={row.Id} data-field={cell.field} onclick={handleRedo} variant='bare' style={cell.styleRedo}></lightning-button-icon>
                                                            </div>
                                                        </template>
                                                    </div>
                                                </template>
                                            </div>
                                        </td>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </template>
            <template lwc:else>
                <lightning-spinner alternative-text="Loading"></lightning-spinner>
            </template>
        </div>
    </lightning-card>
</template>
