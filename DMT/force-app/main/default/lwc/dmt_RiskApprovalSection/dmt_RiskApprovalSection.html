<template>
    <div>

        <!-- Botones tipo radio -->
        <lightning-button-group>
            <lightning-button
                label="Limit"
                data-value="Limit"
                onclick={handleLimitClick}
                variant={variantLimit}
                disabled={isReadOnly}>

            </lightning-button>

            <lightning-button
                label="Line"
                data-value="Line"
                onclick={handleLineLinkClick}
                variant={variantLine}
                disabled={isReadOnly}>

            </lightning-button>
            
        </lightning-button-group>
        <template if:true={showLine}>
                <span
                    class="line-link"
                    onclick={handleLineLinkClick}>
                    {lineName}
                </span>
            </template>
        <!-- Link alineado con el radio "Line" -->
       

    </div>
</template>
