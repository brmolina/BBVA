<template>
    <lightning-modal-header label={modalTitle}></lightning-modal-header>

    <lightning-modal-body>
        <div class="modal-body-container">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Saving" size="medium" variant="brand"></lightning-spinner>
            </template>
            <c-dmt_form_renderer
                fields={fields}
                is-edit-mode="true"
                oneditmodechange={handleEditModeChange}
                onfieldchange={handleFieldChange}>
            </c-dmt_form_renderer>
        </div>
    </lightning-modal-body>

    <lightning-modal-footer>
        <div class="slds-align_absolute-center" style="position:relative;">

            <template if:true={hasError}>
                <div style="position:relative;display:inline-block;">
                    <button
                        onclick={handleErrorButtonClick}
                        class="slds-m-right_xxx-small slds-button_icon-inverse slds-button slds-button_icon"
                        title="Resolve Error">
                        <lightning-icon size="small" icon-name="utility:error"
                            style="--sds-c-icon-color-foreground-default: var(--slds-g-color-error-base-30, var(--lwc-colorBackgroundErrorDark, rgb(186, 5, 23))); --sds-c-icon-color-foreground: var(--slds-g-color-error-base-30, var(--lwc-colorBackgroundErrorDark, rgb(186, 5, 23)));">
                        </lightning-icon>
                    </button>

                    <template if:true={showErrorPopover}>
                        <section
                            aria-describedby="error-popover-body"
                            aria-labelledby="error-popover-title"
                            class="slds-popover slds-popover_error slds-nubbin_bottom-left"
                            role="dialog"
                            style="position:absolute;bottom:calc(100% + 12px);left:-12px;width:14rem;">
                            <button
                                class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close slds-button_icon-inverse"
                                title="Close dialog"
                                onclick={closeErrorPopover}>
                                <lightning-icon size="x-small" icon-name="utility:close"
                                    style="--sds-c-icon-color-foreground-default: white; --sds-c-icon-color-foreground: white">
                                </lightning-icon>
                                <span class="slds-assistive-text">Close dialog</span>
                            </button>
                            <header class="slds-popover__header">
                                <div class="slds-media slds-media_center slds-has-flexi-truncate">
                                    <div class="slds-media__figure">
                                        <lightning-icon size="x-small" icon-name="utility:error"
                                            style="--sds-c-icon-color-foreground-default: white; --sds-c-icon-color-foreground: white">
                                        </lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-truncate slds-text-heading_small" id="error-popover-title" title="Error saving record">Error saving record</h2>
                                    </div>
                                </div>
                            </header>
                            <div class="slds-p-around_small" id="error-popover-body" style="text-align:left;">
                                <p>{errorMessage}</p>
                            </div>
                        </section>
                    </template>
                </div>
            </template>

            <lightning-button variant="neutral" label="Cancel" onclick={handleCancel} disabled={isLoading}></lightning-button>
            <lightning-button variant="brand" label={saveLabel} class="slds-var-m-left_x-small" onclick={handleSave} disabled={isLoading}></lightning-button>
        </div>
    </lightning-modal-footer>
</template>
