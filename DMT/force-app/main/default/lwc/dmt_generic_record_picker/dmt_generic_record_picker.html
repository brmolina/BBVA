<template>
    <div class="cell">
        <lightning-input
            type="search"
            variant="label-hidden"
            placeholder={placeholder}
            value={searchText}
            disabled={disabled}
            onchange={handleInputChange}
            onfocus={handleFocus}
            onblur={handleBlur}
            onkeydown={handleKeyDown}> 
        </lightning-input>

        <template if:true={selectedSubLabel}>
            <span class="slds-text-body_small slds-text-color_weak picker-selected-sublabel">{selectedSubLabel}</span>
        </template>

        <template if:true={showDropdown}>
            <div
                class="slds-dropdown_fluid slds-dropdown_length-5 dropdown slds-scrollable_y"
                role="listbox"
                style={dropdownStyle}
                onmousedown={handleDropdownMouseDown}>
                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                    <template for:each={computedOptions} for:item="opt" for:index="index">
                        <li key={opt.value} class="slds-listbox__item" role="presentation">
                            <div
                                class={opt.cssClass}
                                role="option"
                                data-value={opt.value}
                                data-label={opt.label}
                                data-sublabel={opt.subLabel}
                                data-index={index}
                                onmousedown={handleSelect}
                                onpointerdown={handleSelect}>
                                <span class="slds-media__body">
                                    <span class="option-title slds-truncate" title={opt.label}>
                                        {opt.label}
                                    </span>
                                
                                    <template if:true={opt.showSubLabel}>
                                        <span class="option-subtitle slds-truncate" title={opt.subLabel}>
                                            {opt.subLabel}
                                        </span>
                                    </template>
                                </span>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </template>
    </div>
</template>
