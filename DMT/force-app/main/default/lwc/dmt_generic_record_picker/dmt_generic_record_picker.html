<template>
    <div class="cell">
        <lightning-input
            type="search"
            variant="label-hidden"
            placeholder={placeholder}
            value={searchText}
            disabled={disabled}
            onchange={handleInputChange}
            onfocus={handleFocus}
            onblur={handleBlur}>
        </lightning-input>

        <template if:true={showDropdown}>
            <div
                class="slds-dropdown_fluid slds-dropdown_length-5 dropdown slds-scrollable_y"
                role="listbox"
                onmousedown={handleDropdownMouseDown}>
                <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                    <template for:each={options} for:item="opt">
                        <li key={opt.value} class="slds-listbox__item" role="presentation">
                            <div
                                class="slds-listbox__option slds-listbox__option_plain slds-media slds-media_small slds-media_center slds-p-around_x-small"
                                role="option"
                                data-value={opt.value}
                                data-label={opt.label}
                                onmousedown={handleSelect}
                                onpointerdown={handleSelect}>
                                <span class="slds-truncate" title={opt.label}>{opt.label}</span>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>
        </template>
    </div>
</template>
