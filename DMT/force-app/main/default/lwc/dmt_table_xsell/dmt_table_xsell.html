<template>
    <c-dmt_-table-header-section
    titletable="Cross SELL"
    showcopypaste="false"
    rowscopypaste={tableData}
    tablecolumnscopypaste={columnstablecopypaste}
    context="derivatives"
    isreadonlyuser={isReadOnlyUser}
></c-dmt_-table-header-section>
    <c-custom-data-table
    data={tableData}
    style="max-height: 5vh;height: inherit;"
    columns={columns}
    key-field="Id"
    max-row-selection="0"
    hide-checkbox-column="true"
    onrecordpickerchange={handleRecordPickerChange}
    oncellchange={handleChangeCell}
    oncustomtextinputchanged={textInputChanged}
    onrowaction={handleRowAction}
    suppress-bottom-bar>
    </c-custom-data-table>
    <div style={bottomSpacerStyle}></div>
</template>
