<template>
    <lightning-card if:false={hidden}>


        <div class="slds-m-vertical_medium">
            <div class="slds-grid slds-wrap slds-m-top_x-small">
                <template lwc:if={higherRorc}>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_left">
                        <strong class="slds-text-heading_small">Deal RORC lifetime:</strong>
                        <span class="slds-text-heading_small"> {summaryData.rorc} > {summaryData.rorcThreshold}</span>
                    </div>
                </template>

                <template lwc:else>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_left">
                        <strong class="slds-text-heading_small">Deal RORC lifetime:</strong>
                        <span class="slds-text-heading_small"> {summaryData.rorc} &lt;
                            {summaryData.rorcThreshold}</span>
                    </div>
                </template>

                <template lwc:if={higherRoroec}>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_left">
                        <strong class="slds-text-heading_small">Deal RAROEC lifetime:</strong>
                        <span class="slds-text-heading_small"> {summaryData.raroec} >
                            {summaryData.raroecThreshold}</span>
                    </div>
                </template>

                <template lwc:else>
                    <div class="slds-col slds-size_1-of-2 slds-text-align_left">
                        <strong class="slds-text-heading_small">Deal RAROEC lifetime:</strong>
                        <span class="slds-text-heading_small"> {summaryData.raroec} &lt;
                            {summaryData.raroecThreshold}</span>
                    </div>
                </template>
            </div>

            <div class="slds-grid slds-wrap slds-m-top_small">
                <div class="slds-col slds-size_1-of-2">
                    <strong>RORC Prospective CDD:</strong> {summaryData.rorcProspected}
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <strong>Global Expected RORC:</strong> {summaryData.clientRorc}
                </div>
            </div>
        </div>
        <div class="slds-grid slds-grid_vertical">
            <div class="slds-col">
                <div class="slds-m-top_medium">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small" style="color: #004481;">
                        Summary
                    </h2>

                    <!-- WRAPPER CON SCROLL -->
                    <div class="slds-scrollable_x" style="max-width: 100%; overflow-x: auto;">
                        <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered slds-table-slds-table_cell-fixed"
                            style="min-width: 98%;">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Initial Date</th>
                                    <th>Maturity Date</th>
                                    <th>Average Life</th>
                                    <th>Tenor</th>
                                    <th>Allin Drawn</th>
                                    <th>Allin Undrawn</th>
                                    <th>Spread Drawn</th>
                                    <th>Spread Undrawn</th>
                                    <th>Fees Drawn</th>
                                    <th>Fees Undrawn</th>
                                    <th>FC Drawn</th>
                                    <th>FC Undrawn</th>
                                    <th>Country Risk Drawn</th>
                                    <th>Country Risk Undrawn</th>
                                    <th>Expected Loss</th>
                                    <th>Tax Rate</th>
                                    <th>FD</th>
                                    <th>Net Income</th>
                                </tr>

                            </thead>
                            <tbody>
                                <template for:each={table1Data} for:item="row" for:index="index">
                                    <tr key={row.id} class={row.rowClass}>
                                        <td class="slds-cell-wrap">
                                            <div class="slds-truncate" style="width: 160px;">{row.id}</div>
                                        </td>
                                        <td>{row.initialDate}</td>
                                        <td>{row.maturityDate}</td>
                                        <td>{row.averageLife}</td>
                                        <td>{row.tenor}</td>
                                        <td>{row.allInDb}</td>
                                        <td>{row.allInFb}</td>
                                        <td>{row.spreadDb}</td>
                                        <td>{row.spreadFb}</td>
                                        <td>{row.feesDrawn}</td>
                                        <td>{row.feesUndrawn}</td>
                                        <td>{row.fundingDb}</td>
                                        <td>{row.fundingFb}</td>
                                        <td>{row.countryRiskDb}</td>
                                        <td>{row.countryRiskFb}</td>
                                        <td>{row.pe}</td>
                                        <td>{row.taxRate}</td>
                                        <td>{row.franchiseDeal}</td>
                                        <td>{row.bdi}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="slds-col">
                <div class="slds-m-top_medium">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small" style="color: #004481;">
                        Regulatory Capital
                    </h2>
                    <!-- WRAPPER CON SCROLL -->
                    <div class="slds-scrollable_x" style="max-width: 100%; overflow-x: auto;">
                        <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered slds-table-slds-table_cell-fixed"
                            style="min-width: 98%;">
                            <thead>
                                <tr>
                                    <th style="white-space: nowrap;">ID</th>
                                    <th>Notional Drawn</th>
                                    <th>Notional Undrawn</th>
                                    <th>EAD reg</th>
                                    <th>CCF reg</th>
                                    <th>LGD reg</th>
                                    <th>RWA reg</th>
                                    <th>Regulatory Capital</th>
                                    <th>RORC CDD</th>
                                    <th>RORC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={table3Data} for:item="row">
                                    <tr key={row.id} class={row.rowClass}>
                                        <td class="slds-cell-wrap">
                                            <div class="slds-truncate" style="width: 160px;">{row.id}</div>
                                        </td>
                                        <td>{row.nominalDb}</td>
                                        <td>{row.nominalFb}</td>
                                        <td>{row.eadReg}</td>
                                        <td>{row.ccfReg}</td>
                                        <td>{row.lgdReg}</td>
                                        <td>
                                            <template lwc:if={row.rwaRegIsLink}>
                                                <a href={row.rwaRegUrl} target="_blank">{row.rwaReg}</a>
                                            </template>
                                            <template lwc:else>
                                                {row.rwaReg}
                                            </template>
                                        </td>
                                        <td>{row.cr}</td>
                                        <td>{row.rorcCdd}</td>
                                        <td>{row.rorc}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            <div class="slds-col">
                <div class="slds-m-top_medium">
                    <h2 class="slds-text-heading_small slds-m-bottom_x-small" style="color: #004481;">
                        Economic Capital
                    </h2>
                    <!-- WRAPPER CON SCROLL -->
                    <div class="slds-scrollable_x" style="max-width: 100%; overflow-x: auto;">
                        <table
                            class="slds-table slds-table_cell-buffer slds-table_bordered slds-table-slds-table_cell-fixed"
                            style="min-width: 98%;">
                            <thead>
                                <tr>
                                    <th style="white-space: nowrap;">ID</th>
                                    <th>Notional Drawn</th>
                                    <th>Notional Undrawn</th>
                                    <th>EAD eco</th>
                                    <th>CCF eco</th>
                                    <th>LGD eco</th>
                                    <th>RWA eco</th>
                                    <th>Economic Capital</th>
                                    <th>RAROEC CDD</th>
                                    <th>RAROEC</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={table2Data} for:item="row">
                                    <tr key={row.id} class={row.rowClass}>
                                        <td class="slds-cell-wrap">
                                            <div class="slds-truncate" style="width: 160pxpx;">{row.id}</div>
                                        </td>
                                        <td>{row.nominalDb}</td>
                                        <td>{row.nominalFb}</td>
                                        <td>{row.eadEco}</td>
                                        <td>{row.ccfEco}</td>
                                        <td>{row.lgdEco}</td>
                                        <td>{row.rwaEco}</td>
                                        <td>{row.ce}</td>
                                        <td>{row.raroecCdd}</td>
                                        <td>{row.raroec}</td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
        <div style="margin-top:2em;">
            <canvas lwc:dom="manual" class="chart" height="100" width="300"></canvas>
            <div if:false={chartJsInitialized}>
                loading...
            </div>
        </div>
    </lightning-card>
</template>
