<template>
    <template if:true={dataLoaded}>
        <div class="slds-text-align_center slds-p-bottom_small matrix-title">
            <h2 class="matrix-title__heading">{centralValueName} {label.scenariosText}</h2>
        </div>
        <div class="container-full">
            <div class="matrix-container">
                <!-- Mostrar los nombres de las variables y sus valores máximos y mínimos -->
                <div class="axis-label y-axis">
                    <strong >{yAxisName} ({label.minText}: {yAxisMin}, {label.maxText}: {yAxisMax})</strong>
                </div>
                <div class="show-columns" style="display: flex; flex-direction: column;">
                    <div class="axis-labels">
                        <div class="axis-label">
                            <strong>{xAxisName} ({label.minText}: {xAxisMin}, {label.maxText}: {xAxisMax})</strong>
                        </div>
                    </div>  
                    <div class="matrix-wrapper">
                        <!-- Mostrar los valores de la matriz -->
                        <div class="matrix-body">
                            <div class="columnXvalues">
                                <div class="x-axis-label">
                                    
                                </div>
                                <template for:each={xAxisLabels} for:item="xValue">
                                    <div key={xValue} >
                                        <div class="x-axis-label">
                                            {xValue}
                                        </div>
                                    </div>
                                </template>
                            </div>
                            <template for:each={formattedData} for:item="row">
                                <div key={row.yValue} class="row">
                                    <!-- si el valor es el 0 no lo pinto y solo pinto el -->
                                    <div class="y-axis-label">
                                        {row.yLabel}
                                    </div>
                                    <template for:each={row.rowData} for:item="cell">
                                        <div key={cell.xValue} class="cell">
                                            {cell.cellData}
                                        </div>
                                    </template>
                                </div>
                            </template>
                            
                        </div>

                    </div> 
                    
                </div>
                <div class="slds-p-around_xxx-small copy-btn">
                    <lightning-button-icon icon-name="utility:copy_to_clipboard"  variant="border-filled" alternative-text={label.exportToExcelText} title={label.exportToExcelText} onclick={handleExportToExcel}></lightning-button-icon>
                </div>
            </div>
        </div>
    </template>
    <template if:true={errorMatrix}>
    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
        <span class="slds-assistive-text">{label.ErrorText}</span>
        <span class="slds-icon_container slds-icon-utility-error" title={label.ErrorText}>
            <lightning-icon icon-name="utility:error" alternative-text={label.ErrorText} size="small" class="slds-m-right_x-small" variant="inverse"></lightning-icon>
        </span>
        <h2>{messageError}</h2>
    </div>
    </template>
</template>
