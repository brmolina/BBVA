<template>
    <template if:true={isShown}>
        <div class="toast-container">
            <div class={toastClass} role="status">
                <span class="slds-assistive-text">{variant}</span>

                <span class={iconClass} title={variant}>
                    <lightning-icon icon-name={iconName} size="small" variant="inverse"></lightning-icon>
                </span>

                <div class="slds-notify__content">
                    <h2 class="slds-text-heading_small slds-m-bottom_xx-small" if:true={title}>
                        <b>{title}</b>
                    </h2>
                    <lightning-formatted-rich-text value={message}></lightning-formatted-rich-text>
                </div>

                <div class="slds-notify__close">
                    <button class="slds-button slds-button_icon slds-button_icon-inverse" title="Cerrar" onclick={closeToast}>
                        <lightning-icon icon-name="utility:close" size="small" variant="inverse"></lightning-icon>
                        <span class="slds-assistive-text">Cerrar</span>
                    </button>
                </div>
            </div>
        </div>
    </template>
</template>
