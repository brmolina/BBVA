<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_small">
        <div class="slds-modal__container">
            <header class="slds-modal__header custom-modal-header">
                <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
                    {modalHeaderText}
                </h2>
            </header>

            <div class="slds-modal__content slds-p-around_medium">
                <div class="slds-p-around_small">
                    <div class="slds-grid slds-grid_align-center">
                        <div class="slds-col slds-size_10-of-12">

                            <!-- Task Files Card -->
                            <article class="slds-card slds-card_boundary slds-m-bottom_medium relative-card">
                                <template lwc:if={isHealingPDF}>
                                    <div class="card-glass-overlay">
                                        <lightning-spinner variant="brand" size="small" alternative-text="Generating"></lightning-spinner>
                                    </div>
                                </template>

                                <header class="slds-card__header slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:file" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title">
                                            <span class="slds-text-heading_small">Task Files</span>
                                        </h2>
                                    </div>
                                </header>
                                <div class="slds-card__body">
                                    <div class="slds-p-around_medium"></div>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout" style="width: 100%;">
                                        <thead>
                                            <tr class="slds-text-title_caps">
                                                <th scope="col">
                                                    <div class="slds-truncate" title="Name">Name</div>
                                                </th>
                                                <th scope="col" style="width: 8rem;">
                                                    <div class="slds-truncate" title="Created Date">Created Date</div>
                                                </th>
                                                <th scope="col" style="width: 5rem;">
                                                    <div class="slds-truncate" title="Type">Type</div>
                                                </th>
                                                <th scope="col" style="width: 3.25rem;"></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template lwc:if={isCheckingCoreDocs}>
                                                <tr>
                                                    <td colspan="4" class="slds-text-align_center">
                                                        <div class="slds-text-color_weak">{coreDocsStatusMessage}</div>
                                                    </td>
                                                </tr>
                                            </template>
                                            <template lwc:else>
                                                <template lwc:if={hasExternalFiles}>
                                                    <template for:each={externalFiles} for:item="extFile">
                                                        <tr key={extFile.id}>
                                                            <td>
                                                                <div class="slds-grid slds-grid_vertical-align-center">
                                                                    <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_small"></lightning-icon>
                                                                    <span class="slds-truncate" title={extFile.name}>{extFile.name}</span>
                                                                </div>
                                                            </td>
                                                            <td>
                                                                <div class="slds-truncate">
                                                                    <lightning-formatted-date-time value={extFile.createdDate} year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                                                                </div>
                                                            </td>
                                                            <td>
                                                                <div class="slds-truncate" title={extFile.documentType}>{extFile.documentType}</div>
                                                            </td>
                                                            <td>
                                                                <lightning-button-icon
                                                                    icon-name="utility:download"
                                                                    variant="brand"
                                                                    onclick={handleDownloadExternalFile}
                                                                    data-locator={extFile.contentLocator}
                                                                    data-name={extFile.name}>
                                                                </lightning-button-icon>
                                                            </td>
                                                        </tr>
                                                    </template>
                                                </template>
                                                <template lwc:else>
                                                    <tr>
                                                        <td colspan="4" class="slds-text-align_center">
                                                            <template lwc:if={hasJsonSnapshot}>
                                                                <lightning-button label="Generate PDF" variant="brand" icon-name="utility:refresh" onclick={handleGenerateAndUploadMissingPdf}></lightning-button>
                                                            </template>
                                                            <template lwc:else>
                                                                <div class="slds-text-color_weak">{coreDocsStatusMessage}</div>
                                                            </template>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                        </tbody>
                                    </table>
                                </div>
                            </article>

                            <!-- Task Detail Card -->
                            <article class="slds-card slds-card_boundary slds-m-bottom_medium">
                                <header class="slds-card__header slds-media slds-media_center">
                                    <div class="slds-media__figure">
                                        <lightning-icon icon-name="standard:task" size="small"></lightning-icon>
                                    </div>
                                    <div class="slds-media__body">
                                        <h2 class="slds-card__header-title"><span>{record.step.urlLabel}</span></h2>
                                    </div>
                                </header>
                                <div class="slds-card__body slds-p-around_large">
                                    <div class="slds-grid slds-wrap slds-gutters_x-small">

                                        <div class="slds-col slds-size_2-of-2">
                                            <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">Approver</p>
                                            <input type="text" class="text-line-task" style="width: 95%;" readonly title={record.approver} value={record.approver} />
                                        </div>

                                        <div class="slds-col slds-size_1-of-2">
                                            <p class="slds-text-title slds-m-bottom_xx-small">Status</p>
                                            <input type="text" class="text-line-task" style="width: 95%;" readonly value={record.status} />

                                            <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">Start Date</p>
                                            <input type="text" class="text-line-task" style="width: 95%;" readonly value={record.startDate} />

                                        </div>

                                        <div class="slds-col slds-size_1-of-2">
                                            <p class="slds-text-title slds-m-bottom_xx-small">Result</p>
                                            <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.result} />

                                            <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">End Date</p>
                                            <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.endDate} />
                                        </div>

                                        <template lwc:if={record.description}>
                                            <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                                <p class="slds-text-title slds-m-bottom_xx-small">Comments</p>
                                                <div class="slds-form-element__static slds-textarea textarea-line-task slds-scrollable" style="width: 100%;">
                                                    {record.description}
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </article>

                        </div>
                    </div>
                </div>
            </div>

            <footer class="slds-modal__footer">
                <lightning-button
                    label="Close"
                    onclick={closeModal}
                    disabled={closeButtonDisabled}>
                </lightning-button>
            </footer>
        </div>
    </section>
</template>
