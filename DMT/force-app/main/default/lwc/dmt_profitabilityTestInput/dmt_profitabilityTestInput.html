<template>
    <div class="axis-input slds-p-right_x-small slds-m-left_xx-small slds-m-bottom_xx-small">
        <template if:true={isRating}>
            <lightning-combobox
                label={label}
                options={options}
                value={_internalValue}
                placeholder="Select"
                disabled={noRatingOptions}
                onchange={handleChange}>
            </lightning-combobox>
        </template>
        <template if:false={isRating}>
            <lightning-input
                label={label}
                type="text"
                inputmode="decimal"
                value={_internalValue}
                placeholder={computedPlaceholder}
                onchange={handleChange}>
            </lightning-input>
        </template>
    </div>
</template>
