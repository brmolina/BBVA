<template>
    <template if:true={hasAccess}>
        <div class="slds-theme_default slds-box">
            <p>
                <lightning-icon icon-name="standard:contact_list" size="small">
                </lightning-icon>&nbsp;&nbsp;&nbsp;<b>NPS </b>
            </p>
            <br /><br />
            <center>
                <lightning-button label="NPS Clients Management" variant="brand" onclick={openmodal}></lightning-button>
            </center>




            <template if:true={openmodel}>
                <div class="demo-only" style="height: 640px;">
                    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
                        aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                    title="Close" onclick={closeModal}>
                                    <lightning-icon icon-name="utility:close" size="medium">
                                    </lightning-icon>
                                    <span class="slds-assistive-text">Close</span>
                                </button>
                                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate"><strong>{resCheckData.client.Name}: NPS Management</strong>
                                </h2>
                            </header>

                            <lightning-record-edit-form record-id={recordId} object-api-name="Account" onsuccess={handleSuccess}
                                onsubmit={handleSubmit} class="slds-modal__content slds-p-top_medium" id="modal-content-id-1">
                                <lightning-messages>
                                </lightning-messages>

                                <template if:true={pending} >
                                    <div class="spinnerClass slds-is-relative">
                                        <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                    </div>
                                </template>

                                <div class="slds-p-around_medium">
                                    <template if:true={resCheckData.isGroup}>
                                        <h2><b>Warning:</b></h2><br />
                                        <p>Changing the NPS field on this client will affect its related affiliated clients.</p><br />
                                    </template>

                                    <center>
                                        <lightning-input-field field-name="survey_nps_contact_type__c" label="NPS Record" class="slds-checkbox_toggle" onchange={toggleUpdateButton}>
                                        </lightning-input-field>
                                    </center>
                                </div>
                                <footer class="slds-modal__footer">
                                    <lightning-button label="Cancel" variant="neutral" onclick={closeModal}></lightning-button>
                                    &nbsp;&nbsp;&nbsp;&nbsp;
                                    <template if:true={displayUpdate}>
                                        <lightning-button class="slds-m-top_small " id="buttonUpdate" variant="brand" type="submit" name="update" label="Update" >
                                        </lightning-button>
                                    </template>
                                </footer>

                            </lightning-record-edit-form>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </div>
            </template>
        </div>
    </template>
</template>
