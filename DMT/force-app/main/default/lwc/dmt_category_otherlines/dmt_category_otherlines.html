<template>
    <template if:true={showSpinner}>
    <div class="spinnerClass">
        <lightning-spinner alternative-text="Loading" size="x-small"></lightning-spinner>
    </div>
    </template>
    <template if:false={showSpinner}>
    <div class="slds-modal__header slds-theme_default slds-truncate slds-text-heading_medium slds-hyphenate">
        New Category:
    </div>
    <template if:true={products}>
        <div class="containerClass slds-scrollable">
        <template for:each={products} for:item="prod">
                <div key={prod.Id} class="row">
                <label class="custom-radio">
                <input
                    data-id={prod.Id}
                    type="checkbox"
                    checked={prod.selected}
                    onchange={handleSelect}/>
                <span class="radio-circle"></span>
                </label>
                <span data-id={prod.Id} onclick={handleSelect}  class="nameClass">{prod.Name}</span>
                <template if:true={prod.selected}>
                    <lightning-combobox
                        name="maxTerm"
                        placeholder="Max Term"
                        options={optionsTerm}
                        value={prod.maxterm}
                        class="comboClass"
                        onchange={handleSelectMaxTerm}>
                    </lightning-combobox>
                </template>
                </div>
        </template>
        </div>
    </template>
    <div class="slds-modal__footer" style="text-align: center;">
        <button class="slds-button slds-button_neutral" onclick={handleCancel}>
            Cancel
        </button>
        <button class="slds-button slds-button_brand" onclick={handleSave} disabled={disableSave}>
            Save
        </button>
    </div>
</template>
    
</template>
