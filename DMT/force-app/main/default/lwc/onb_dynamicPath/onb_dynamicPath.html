<template>
    <div class="slds-path slds-p-horizontal_medium slds-p-bottom_x-small">
        <div class="slds-grid slds-path__track">
            <div class="slds-grid slds-path__scroller-container">
                <div class="slds-path__scroller">
                    <div class="slds-path__scroller_inner">
                        <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal" aria-labelledby="stageLabel">
                            <template for:each={stepsUi} for:item="step">
                                <li key={step.key} class={step.liClass} role="presentation">
                                    <a class="slds-path__link"
                                        href="#"
                                        role="option"
                                        aria-selected={step.ariaSelected}
                                        tabindex="0"
                                        data-step-key={step.key}
                                        onclick={handleStepClick}>
                                        <span class="slds-path__stage">
                                            <svg class="slds-icon slds-icon_x-small" aria-hidden="true">
                                                <use xlink:href={checkIconHref}></use>
                                            </svg>
                                        </span>
                                        <span class="slds-path__title">{step.label}</span>
                                    </a>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-path__action">
                <span id="stageLabel" class="slds-path__stage-name">
                    Stage: {selectedStepLabel}
                </span>

                <button class="slds-button slds-button_brand slds-path__mark-complete"
                        onclick={handleMarkComplete}
                        disabled={disableMarkComplete}>
                    <svg class="slds-button__icon slds-button__icon_left" aria-hidden="true">
                        <use xlink:href={checkIconHref}></use>
                    </svg>
                    Mark Step as Complete
                </button>
            </div>
        </div>
    </div>
</template>
