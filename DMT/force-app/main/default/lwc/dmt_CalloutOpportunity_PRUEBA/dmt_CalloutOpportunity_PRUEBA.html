<template>
        <!-- STEP 1 -->
        <template if:true={isStepOne}>
            <c-custom-data-table
                key-field="lineId"
                data={lines}
                columns={columnsStep1}
                max-row-selection="1"
                onrowselection={handleRowSelection}>
            </c-custom-data-table>

            <div class="slds-m-top_small slds-text-align_center">
                <lightning-button label="Next" onclick={goToNextStep}></lightning-button>
            </div>
        </template>

        <!-- STEP 2 -->
        <template if:true={isStepTwo}>
            <div style="position:relative;z-index: 2">
                <c-custom-data-table
                    key-field="lineId"
                    data={productOPP}
                    columns={columnsStep2}
                    oncellchange={handleCellChange}
                    hide-checkbox-column="true"
                    suppress-bottom-bar>
                </c-custom-data-table>
            </div> 
            <div class="slds-m-top_small slds-text-align_center">
                <lightning-button label="Previous" onclick={goToPreviousStep}></lightning-button>
                <lightning-button label="Save" variant="brand" onclick={handleSave} class="slds-m-left_small"></lightning-button>
            </div>
        </template>

        <template if:true={error}>
            <p class="slds-text-color_error">Error al cargar datos: {error}</p>
        </template>
</template>
