<template>
    <lightning-modal-header class="slds-modal__title slds-hyphenate"
        label={labels.DMT_titleNewLine}></lightning-modal-header>

    <lightning-modal-body>
        <div style="position: relative;">
            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading" variant="brand"></lightning-spinner>
            </template>
            <div
                class="slds-notify slds-notify_alert slds-theme_info"
                role="status"
            >
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon
                            icon-name="utility:info"
                            alternative-text="Information"
                            size="x-small"
                        ></lightning-icon>
                    </div>

                    <div class="slds-media__body">
                        <p>
                            This line has no associated profitability calculation. To
                            include profitability, please create the line from the
                            Opportunity tab.
                        </p>
                    </div>
                </div>
            </div>

            <div class="slds-grid slds-gutters_large">
                
                <!-- LEFT COLUMN -->
                <div class="slds-col slds-size_1-of-2  slds-p-top_small">
                    <article class="slds-tile slds-media slds-p-left_medium">
                        <div class="slds-media__figure slds-p-left_small">
                            <lightning-icon icon-name="action:new_account" alternative-text={labels.DMT_AccountText} title={labels.DMT_AccountText}
                                size="medium">
                            </lightning-icon>
                        </div>

                        <div class="slds-media__body slds-m-top_x-small">
                            <div class="slds-tile__title" title={companyName}>
                                <a style="font-weight: bold;" class="slds-text-color_default slds-m-bottom_x-small"
                                    href={companyHref} target="_blank" rel="noopener noreferrer">
                                    {companyName}
                                </a>
                            </div>

                            <div class="slds-grid slds-grid_vertical slds-m-top_small" style="row-gap: 0.5rem;">

                                <template if:true={showClientType}>
                                    <div class="slds-col slds-grid slds-p-around_none">
                                        <div class="slds-col slds-size_2-of-6 slds-p-around_none slds-text-color_weak">
                                            {labels.DMT_ClientType}:
                                        </div>
                                        <div
                                            class="slds-col slds-size_4-of-6 slds-p-around_none slds-text-body_small slds-hyphenate slds-align-bottom">
                                            {clientTypeLabel}
                                        </div>
                                    </div>
                                </template>

                                <template if:true={showClientCode}>
                                    <div class="slds-col slds-grid slds-p-around_none">
                                        <div class="slds-col slds-size_2-of-6 slds-p-around_none slds-text-color_weak">
                                            {labels.DMT_ClientCode}:
                                        </div>
                                        <div
                                            class="slds-col slds-size_4-of-6 slds-p-around_none slds-text-body_small slds-hyphenate slds-align-bottom">
                                            {clientCode}
                                        </div>
                                    </div>
                                </template>

                                <template if:true={showGroupCode}>
                                    <div class="slds-col slds-grid slds-p-around_none">
                                        <div class="slds-col slds-size_2-of-6 slds-p-around_none slds-text-color_weak">
                                            {labels.DMT_GroupCode}:
                                        </div>
                                        <div
                                            class="slds-col slds-size_4-of-6 slds-p-around_none slds-text-body_small slds-hyphenate slds-align-bottom">
                                            {groupCode}
                                        </div>
                                    </div>
                                </template>

                                <template if:true={showCountry}>
                                    <div class="slds-col slds-grid slds-p-around_none">
                                        <div class="slds-col slds-size_2-of-6 slds-p-around_none slds-text-color_weak">
                                            {labels.DMT_Country}:
                                        </div>
                                        <div
                                            class="slds-col slds-size_4-of-6 slds-p-around_none slds-text-body_small slds-hyphenate slds-align-bottom">
                                            {country}
                                        </div>
                                    </div>
                                </template>

                                <template if:true={showTaxPayer}>
                                    <div class="slds-col slds-grid slds-p-around_none">
                                        <div class="slds-col slds-size_2-of-6 slds-p-around_none slds-text-color_weak">
                                            {labels.DMT_TaxPayer}:
                                        </div>
                                        <div
                                            class="slds-col slds-size_4-of-6 slds-p-around_none slds-text-body_small slds-hyphenate slds-align-bottom">
                                            {taxPayer}
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </div>
                    </article>
                </div>

                <!-- RIGHT COLUMN -->
                <div class="slds-col slds-size_1-of-2 slds-m-bottom_x-small">
                    <div class="slds-p-right_x-large">
                        <lightning-combobox label={labels.DMT_LineType} value={lineType} options={lineTypeOptions}
                            onchange={handleLineTypeChange} placeholder={labels.DMT_SelectTypeLineText}
                            class="slds-m-bottom_small" disabled={isLoading}>
                        </lightning-combobox>


                        <lightning-input name="lineName" label={labels.DMT_Name} value={name}
                            onchange={handleNameChange} disabled={isNameDisabled} maxlength="50" required
                            class="slds-m-bottom_small">
                        </lightning-input>

                        <div class={entificWrapperClass}>
                            <lightning-combobox label={labels.DMT_Entific} value={entific} options={entificOptions}
                                onchange={handleEntificChange} disabled={isEntificDisabled} required
                                placeholder={labels.DMT_SelectWithTreePints}>
                            </lightning-combobox>

                            <template if:true={showPermissionError}>
                                <div class="slds-form-element__help slds-text-color_error">
                                    {labels.DMT_permissionErrorMessage}
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

            </div>
        </div>
         
    </lightning-modal-body>

    <lightning-modal-footer>
        <div class="slds-grid slds-grid_align-center slds-gutters_small">
            <div class="slds-col">
                <lightning-button label={labels.DMT_CancelText} variant="neutral" onclick={handleCancel} disabled={isLoading}>
                </lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button class="slds-m-left_small" label={labels.DMT_SaveAndEditText} variant="brand"
                    onclick={handleSaveAndEdit} disabled={isSaveDisabled}>
                </lightning-button>
            </div>
        </div>
    </lightning-modal-footer>
</template>
