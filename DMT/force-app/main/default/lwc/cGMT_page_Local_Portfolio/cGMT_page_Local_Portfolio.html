<template>
    <lightning-card>
        <div class="slds-text-align_center slds-m-around_xx-large slds-text-heading_large">
            <lightning-icon icon-name="pro_network" alternative-text="portfolio" title="Portfolio"></lightning-icon>

        </div>
        <div class="slds-text-align_center slds-m-around_xx-large " style="font-size: 2.7rem;bottom: 22px; position: relative;">
            Local Portfolio
        </div>
        <div class="slds-text-align_center slds-m-around_xx-large slds-text-heading_medium" style="top: -25px; position: relative;left: -7px;">
            Loading
            <template lwc:if={isLoading}>   
                <div class="loading">
                    <lightning-spinner alternative-text="Loading"  variant="brand" size="small" class="styleSpinner" ></lightning-spinner>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
