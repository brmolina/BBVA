<template>
    <div class="slds-card slds-p-around_medium slds-m-bottom_small">
        <div class="slds-path">
            <div class="slds-grid slds-path__track">
                <div class="slds-grid slds-path__scroller-container">
                    <div class="slds-path__scroller">
                        <div class="slds-path__scroller_inner">
                            <ul class="slds-path__nav" role="listbox" aria-orientation="horizontal" aria-label="Stage Path">
                                <template for:each={computedSteps} for:item="step">
                                    <li key={step.value} class={step.cssClass} role="presentation">
                                        <a class="slds-path__link"
                                           role="option"
                                           tabindex={step.tabindex}
                                           aria-selected={step.isSelected}
                                           aria-disabled={step.ariaDisabled}
                                           data-value={step.value}
                                           onclick={handleStageClick}
                                           title={step.label}>
                                            <span class="slds-path__stage">
                                                <lightning-icon icon-name="utility:check"
                                                                size="x-small"
                                                                variant="inverse"
                                                                alternative-text="Stage Complete">
                                                </lightning-icon>
                                                <span class="slds-assistive-text">Stage Complete</span>
                                            </span>
                                            <span class="slds-path__title">{step.label}</span>
                                        </a>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Botón de acción del Path (oculto en read-only) -->
                <template lwc:if={showActionButton}>
                    <div class="slds-grid slds-path__action">
                        <div class="slds-is-relative action-button-wrapper">
                            <button class="slds-button slds-button_brand slds-path__mark-complete"
                                    disabled={isLoading}
                                    onclick={handleMarkComplete}>
                                <lightning-icon class="slds-button__icon slds-button__icon_left"
                                                icon-name="utility:check"
                                                size="x-small"
                                                variant="inverse"
                                                alternative-text="Check">
                                </lightning-icon>
                                {buttonLabel}
                            </button>
                            <template lwc:if={isLoading}>
                                <div class="spinner-overlay">
                                    <div role="status" class="slds-spinner slds-spinner_small slds-spinner_brand">
                                        <span class="slds-assistive-text">Loading</span>
                                        <div class="slds-spinner__dot-a"></div>
                                        <div class="slds-spinner__dot-b"></div>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</template>
