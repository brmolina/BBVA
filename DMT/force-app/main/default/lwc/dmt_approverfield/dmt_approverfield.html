<template>
    <lightning-card>
        <div class="slds-form-element">
            <label class="slds-form-element__label">
                <span class="slds-required" if:true={required}>*</span>
                {label}
            </label>
            <div class="slds-form-element__control">
                <div class="slds-combobox_container">
                    <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click">
                        <div class="slds-combobox__form-element slds-input-has-fixed-addon" role="none">
                            <input class="slds-input slds-combobox__input"
                                   type="text"
                                   placeholder={placeholder}
                                   value={searchTerm}
                                   oninput={handleSearch}
                                   onblur={handleBlur}
                                   disabled={disabled}
                                   aria-autocomplete="list"
                                   aria-controls="dropdown-id" />
                            
                            <span class="slds-icon_container slds-input__icon slds-input__icon_right">
                                <lightning-icon icon-name="utility:search" size="x-small"></lightning-icon>
                            </span>
                        </div>
                        <div if:true={showDropdown} id="dropdown-id" 
                              role="listbox">
                            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                                <template for:each={searchResults} for:item="result">
                                    <li key={result.id} 
                                        class="slds-listbox__item"
                                        role="presentation">
                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity" 
                                             role="option"
                                             data-id={result.id}
                                             onclick={handleSelect}>
                                            <div class="slds-media__figure">
                                                <span class="slds-icon_container">
                                                    <lightning-icon icon-name={result.icon} size="x-small"></lightning-icon>
                                                </span>
                                            </div>
                                            <div class="slds-media__body">
                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">
                                                    {result.name}
                                                </span>
                                                <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                    {result.subtitle}-{result.entific}
                                                </span>
                                                <!-- <div if:true={haveMembers}>
                                                    <small>Members: 
                                                        <template for:each={result.members} for:item="member">
                                                            <span key={member.name}>{member.name}, </span>
                                                        </template>
                                                    </small>
                                                </div> -->
                                            </div>
                                        </div>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </div>
                </div>
                
                <!-- Mostrar approver seleccionado -->
                <div if:true={selectedApprover} class="slds-m-top_small">
                    <article class="slds-tile">
                        <div class="slds-tile__detail">
                            <p class="slds-tile__title slds-truncate">
                                <strong>Selected:</strong> {selectedApprover.name}
                            </p>
                            <p class="slds-tile__meta" if:true={selectedApprover.subtitle}>
                                {selectedApprover.subtitle}
                            </p>
                        </div>
                        <button class="slds-button slds-button_icon slds-button_icon-border-filled"
                                onclick={handleClear}
                                title="Clear selection">
                            <lightning-icon icon-name="utility:clear" size="x-small"></lightning-icon>
                        </button>
                    </article>
                </div>
                
                <!-- Loading spinner -->
                <div if:true={isLoading} class="slds-m-top_x-small">
                    <lightning-spinner alternative-text="Loading"></lightning-spinner>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
