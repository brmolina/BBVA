<template>
    <div class="slds-form-element">
        <label class="slds-form-element__label" for="combobox-input">
            <abbr if:true={required} class="slds-required" title="required">*</abbr>
            {label}
        </label>

        <div class="slds-form-element__control slds-is-relative">
            <div class="slds-combobox_container">
                <div class={comboboxClass} aria-expanded={showDropdown} aria-haspopup="listbox" role="combobox">
                    <div class="slds-combobox__form-element slds-input-has-icon slds-input-has-icon_right" role="none">
                            <template if:false={hasSelection}>
                            <input class="slds-input slds-combobox__input"
                                id="combobox-input"
                                type="text"
                                placeholder={placeholder}
                                value={searchTerm}
                                oninput={handleSearch}
                                onblur={handleBlur}
                                onfocus={handleFocus}
                                disabled={disabled}
                                role="textbox"
                                autocomplete="off" />

                            <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                    title="Clear"
                                    onclick={handleClear}>
                                <lightning-icon
                                    icon-name={rightIconName}
                                    size="x-small"
                                    class="slds-icon slds-icon_small slds-icon-text-default">
                                </lightning-icon>
                            </button>
                        </template>

                        <template if:true={hasSelection}>
                            <div class="slds-pill_container slds-p-right_large">
                            <span class="slds-pill" title={selectedApprover.name}>
                                <span class="slds-pill__label">{selectedApprover.name}</span>
                                <button
                                class="slds-button slds-button_icon slds-pill__remove"
                                title="Remove"
                                onclick={handleClear}
                                disabled={disabled}>
                                <lightning-icon icon-name="utility:close" size="x-small"></lightning-icon>
                                </button>
                            </span>
                            </div>

                            <!-- icono derecha (X) opcional, si quieres mantenerlo igual -->
                            <button class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                                    title="Clear"
                                    onclick={handleClear}
                                    disabled={disabled}>
                            <lightning-icon icon-name="utility:clear" size="x-small"></lightning-icon>
                            </button>
                        </template>
                    </div>

                    <div if:true={showDropdown}
                         class="slds-dropdown slds-dropdown_fluid slds-dropdown_length-with-icon-7 slds-dropdown_left custom-dropdown-style"
                         role="listbox">
                        <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                            <template if:true={hasResults}>
                                <template for:each={searchResults} for:item="result">
                                    <li key={result.id} role="presentation" class="slds-listbox__item">
                                        <div class="slds-media slds-listbox__option slds-listbox__option_entity slds-listbox__option_has-meta"
                                            role="option"
                                            data-id={result.id}
                                            onmousedown={handleSelect}> <span class="slds-media__figure slds-listbox__option-icon">
                                                <lightning-icon icon-name={result.icon} size="small"></lightning-icon>
                                            </span>
                                            <span class="slds-media__body">
                                                <span class="slds-listbox__option-text slds-listbox__option-text_entity">{result.name}</span>
                                                <span class="slds-listbox__option-meta slds-listbox__option-meta_entity">
                                                    {result.subtitle} • {result.entific}
                                                </span>
                                            </span>
                                        </div>
                                    </li>
                                </template>
                            </template>
                            <template if:true={showNoResults}>
                                <li role="presentation" class="slds-listbox__item">
                                    <div class="slds-p-around_small slds-text-align_center slds-text-color_weak no-results">
                                    <lightning-icon icon-name="utility:info" size="x-small" class="slds-m-right_x-small"></lightning-icon>
                                    <span>No records to display</span>
                                    </div>
                                </li>
                            </template>
                        </ul>
                    </div>
                </div>
            </div>

            <div if:true={isLoading} class="slds-is-relative slds-m-top_xx-small">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </div>
    </div>
</template>
