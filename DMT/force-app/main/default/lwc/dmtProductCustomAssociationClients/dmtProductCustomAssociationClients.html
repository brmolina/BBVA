<template>
    <lightning-card>
        <div class="panel-shell">
            <template lwc:if={showOverlay}>
                <div class="loading-overlay" role="status" aria-live="polite">
                    <div class="loading-box">
                        <div class="spinner-wrap" aria-hidden="true">
                            <div class="slds-spinner slds-spinner_medium slds-spinner_brand" role="status">
                                <span class="slds-assistive-text">Loading</span>
                                <div class="slds-spinner__dot-a"></div>
                                <div class="slds-spinner__dot-b"></div>
                            </div>
                        </div>
                        <p class="loading-text">{loadingMessage}</p>
                    </div>
                </div>
            </template>

            <div class="toolbar">
                <div class="selection-summary">
                    <span class="selection-summary__label">Selected records</span>
                    <span class="selection-summary__count">{selectedCount}</span>
                </div>
            </div>

            <template lwc:if={hasError}>
                <div class="table-message table-message--error">{errorMessage}</div>
            </template>

            <div class="table-frame">
                <table class="client-table" role="grid" aria-label="product custom association clients">
                    <thead>
                        <tr>
                            <th scope="col">Client Name</th>
                            <th scope="col">Internal Rating (short)</th>
                            <th scope="col">Current Rating Tool Date</th>
                            <th scope="col">Star Code</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template lwc:if={hasVisibleClients}>
                            <template for:each={visibleClients} for:item="client">
                                <tr key={client.customerId} class={client.rowClass}>
                                    <td class="name-col">
                                        <button
                                            type="button"
                                            class="name-link"
                                            data-id={client.customerId}
                                            title={client.customerName}
                                            onclick={handleClientToggle}
                                        >
                                            {client.customerName}
                                        </button>
                                        <div class="secondary-text">{client.countryIfoId} - {client.customerId}</div>
                                    </td>
                                    <td>{client.updSmsclInternalRatgType}</td>
                                    <td>{client.currentRatingToolDate}</td>
                                    <td>{client.customerCounterpartiesCodesDesc}</td>
                                </tr>
                            </template>
                        </template>
                        <template lwc:else>
                            <tr>
                                <td colspan={totalColumns} class="empty-row">No records to display.</td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>

            <template lwc:if={showFooter}>
                <div class="footer-area">
                    <div></div>
                    <div class="actions">
                        <lightning-button label="Cancel" variant="neutral" onclick={handleCancel}></lightning-button>
                        <lightning-button label="Save" variant="brand" onclick={handleSave} disabled={isSaveDisabled}></lightning-button>
                    </div>
                </div>
            </template>
        </div>
    </lightning-card>
</template>
