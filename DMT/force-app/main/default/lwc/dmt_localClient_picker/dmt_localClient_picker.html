<template>
    <template if:true={hasValueEntity}>
        <lightning-record-picker
            label={labelValue}
            placeholder={placeholderValue}
            filter={filter}
            object-api-name="Local_Client__c"
            if:true={hasValue}
            value={clientId}
            matching-info={matchingInfo}
            required
            display-info={displayInfo}
            disabled={disabled}
            onchange={handleChange}>
        </lightning-record-picker>

        <template if:false={hasValue}>
            <lightning-record-picker
                label={labelValue}
                placeholder={placeholderValue}
                filter={filter}
                object-api-name="Local_Client__c"
                matching-info={matchingInfo}  
                required
                display-info={displayInfo}
                disabled={disabled}
                onchange={handleChange}>
            </lightning-record-picker>
        </template>
    </template>

    <template if:false={hasValueEntity}>
        <lightning-record-picker
            label={labelValue}
            placeholder={placeholderValue}
            object-api-name="Local_Client__c"
            if:true={hasValue}
            value={clientId}
            matching-info={matchingInfo}
            required
            display-info={displayInfo}
            disabled={disabled}
            onchange={handleChange}>
        </lightning-record-picker>

        <template if:false={hasValue}>
            <lightning-record-picker
                label={labelValue}
                placeholder={placeholderValue}
                object-api-name="Local_Client__c"
                matching-info={matchingInfo}
                display-info={displayInfo}
                required
                disabled={disabled}
                onchange={handleChange}>
            </lightning-record-picker>
        </template>
    </template>
</template>
