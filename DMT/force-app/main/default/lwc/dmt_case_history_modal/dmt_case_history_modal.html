<template>
  <section
    role="dialog"
    tabindex="-1"
    aria-labelledby="modal-heading-01"
    aria-modal="true"
    class="slds-modal slds-fade-in-open"
  >
    <div class="slds-modal__container modal-task-history">
      <header class="slds-modal__header">
        <template lwc:if={hasFeatureName}>
        <h2 id="modal-heading-01" class="slds-text-heading_medium">
          {record.featureName}: Task detail
        </h2>
        </template>
        <template lwc:else>
            <h2 id="modal-heading-02" class="slds-text-heading_medium">
                Task detail
            </h2>
        </template>
      </header>
      <div class="slds-modal__content slds-p-around_medium task-modal-content">
        <div class="slds-modal__body slds-grid task-modal-body">
            <div class="slds-col slds-size_5-of-12 task-modal-first-col">
              <div style="margin-bottom:1rem;">
                <c-dmt_file_table record-id={record.taskId} do-reload={doreload}></c-dmt_file_table>
              </div>
                <article class="slds-card_boundary">
                    <div class="slds-card__header slds-grid">
                      <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                          <span class="slds-icon_container slds-icon-standard-task">
                            <svg class="slds-icon slds-icon_small" aria-hidden="true">
                              <use xlink:href="/_slds/icons/standard-sprite/svg/symbols.svg#task"></use>
                            </svg>
                            <span class="slds-assistive-text">Tarea</span>
                          </span>
                        </div>
                        <div class="slds-media__body">
                          <h2 class="slds-card__header-title">
                              <span>{record.step.urlLabel}</span>
                          </h2>
                        </div>
                      </header>
                    </div>
                    <div class="slds-grid slds-wrap slds-p-around_medium">
                      <div class="slds-col slds-size_6-of-12">
                        <div class="slds-col slds-size_12-of-12">
                          <p>Status:</p>
                          <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.status} />
                        </div>
                        <div class="slds-col slds-size_12-of-12">
                          <p>Approver:</p>
                          <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.approver} />
                        </div>
                        <div class="slds-col slds-size_12-of-12">
                          <div class="slds-col slds-size_12-of-12">
                            <p>Start Date:</p>
                            <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.startDate} />
                          </div>
                        </div>
                      </div>
                      <div class="slds-col slds-size_6-of-12">
                          <div class="slds-col slds-size_12-of-12">
                            <p>Result:</p>
                            <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.result} />
                          </div>
                          <div class="slds-col slds-size_12-of-12">
                            <p>User:</p>
                            <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.user} />
                          </div>
                          <div class="slds-col slds-size_12-of-12">
                            <div class="slds-col slds-size_12-of-12">
                              <p>End Date:</p>
                              <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.endDate} />
                            </div>
                          </div>
                      </div>
                      <div class="slds-col slds-size_12-of-12">
                        <div class="slds-col slds-size_12-of-12">
                          <p>Line/Opportunity Date to Proposal:</p>
                          <input type="text" class="slds-input slds-col slds-size_11-of-12 text-line-task" readonly value={record.lineOpportunityDateToProposal} />
                        </div>
                      </div>  
                      <div lwc:if={record.description} class="slds-col slds-size_12-of-12">
                        <div class="slds-form-element">
                          <span class="slds-form-element__label">Comments:</span>
                          <div class="slds-form-element__control">
                            <div class="slds-form-element__static slds-textarea textarea-line-task slds-scrollable">
                              <p>{record.description}</p>
                            </div>
                          </div>
                        </div>
                      </div>                             
                    </div>
                </article>

                <article class="slds-card_boundary slds-m-top_medium">
                    <div class="slds-card__header slds-grid">
                      <header class="slds-media slds-media_center slds-has-flexi-truncate">
                        <div class="slds-media__figure">
                          <span class="slds-icon_container slds-icon-standard-task">
                            <svg class="slds-icon slds-icon_small" aria-hidden="true">
                              <use xlink:href="/_slds/icons/standard-sprite/svg/symbols.svg#task"></use>
                            </svg>
                            <span class="slds-assistive-text">Caso</span>
                          </span>
                        </div>
                        <div class="slds-media__body">
                          <h2 class="slds-card__header-title">
                              <span>Case Information</span>
                          </h2>
                        </div>
                      </header>
                    </div>
                    <div class="slds-grid slds-wrap slds-p-around_medium">
                      <div class="slds-col slds-size_12-of-12">
                        <div class="slds-form-element">
                          <span class="slds-form-element__label">Case Description:</span>
                          <div class="slds-form-element__control">
                            <div class="slds-form-element__static slds-textarea textarea-line-task slds-scrollable">
                              <p>{caseDescription}</p>
                            </div>
                          </div>
                        </div>
                      </div>                             
                    </div>
                </article>
            </div>
            <div class="slds-col slds-size_7-of-12">
                <lightning-card class="templateStyle">
                  <template lwc:if={isLoading}>
                      <div class="containerView">
                          <div class="styleTextView">
                              <p >Please wait until view is generated...</p>
                          </div>
                          <div class="styleSpinnerView">
                              <lightning-spinner alternative-text="Generating view..." size="medium"></lightning-spinner>
                          </div>
                      </div>
                  </template>
                  <template lwc:if={showHTML}>
                      <div class="previewContent">
                          <div class="StyleContentHTML">
                              <div class="contentHtml" lwc:dom="manual"></div>
                          </div> 
                      </div>
                  </template> 
              </lightning-card>
              <template lwc:if={showPdf}>
                <c-preview-pdf pdf-data={pdfData}></c-preview-pdf>
              </template>
              <lightning-card>
                <div class="containerDowload">
                    <template lwc:if={showDowloadpdf}>
                        <div class="buttonContent">
                          <lightning-button 
                            style="padding:1rem;" 
                            label="Download PDF" 
                            onclick={handleDownloadPDF}
                            disabled={isDownloadInProgress}
                            >
                          </lightning-button>     
                      </div>

                      <!-- Downloading overlay inside footer -->
                      <template lwc:if={downloadInProgress}>
                        <div class="footerOverlay">
                            <div class="loaderContent">
                                <p>Downloading PDF...</p>
                                <div class="progressBar">
                                    <div class="progressBarInner"></div>
                                </div>
                            </div>
                        </div>
                      </template>
                    </template>
                </div>
              </lightning-card > 
            </div>
            <template lwc:if={showErrorPdf}>
              <div class="slds-col slds-size_7-of-12 slds-flex slds-align_absolute-center slds-justify_center" style="position: absolute; left: 50em; top: 37em;">
                <div class="slds-text-align_center slds-m-around_medium">
                  <lightning-icon icon-name="utility:error" size="large" alternative-text="Error" class="slds-icon-text-error" variant="error"></lightning-icon>
                  <p class="slds-text-heading_medium">Step's template not found.</p>
                  <p>There is an error with this completed task, please contact the administrator.</p>
                </div> 
              </div>
            </template>            
        </div>
      </div> <!-- del body-->
      <footer class="slds-modal__footer">
        <lightning-button
          label="Close"
          onclick={closeModal}
        ></lightning-button>
      </footer>
    </div>
  </section>
  <div class="slds-backdrop slds-backdrop_open"></div>
  <c-pdf-generator ></c-pdf-generator>
</template>
