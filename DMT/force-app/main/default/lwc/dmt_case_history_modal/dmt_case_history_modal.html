<template>
    <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open slds-modal_large">
        <div class="slds-modal__container">
            <header class="slds-modal__header custom-modal-header">
              <h2 class="slds-modal__title slds-hyphenate slds-text-heading_medium">
                  {modalHeaderText}
              </h2>
          </header>

            <div class="slds-modal__content slds-p-around_medium">
              <div class="slds-p-around_small">
                <div class="slds-grid slds-gutters_large slds-p-horizontal_large">
                    <div class="slds-col slds-size_4-of-12 slds-p-left_medium">
                        <article class="slds-card slds-card_boundary slds-m-bottom_medium relative-card">
                            <template lwc:if={isHealingPDF}>
                                <div class="card-glass-overlay">
                                    <lightning-spinner variant="brand" size="small" alternative-text="Generating"></lightning-spinner>
                                </div>
                            </template>

                            <header class="slds-card__header slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:file" size="small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title">
                                        <span class="slds-text-heading_small">Task Files</span>
                                    </h2>
                                </div>
                            </header>
                            <div class="slds-card__body">
                                <div class="slds-p-around_medium"></div>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout" style="width: 100%;">
                                    <thead>
                                        <tr class="slds-text-title_caps">
                                            <th scope="col">
                                            <div class="slds-truncate" title="Name">Name</div>
                                            </th>
                                            <th scope="col" style="width: 8rem;">
                                            <div class="slds-truncate" title="Created Date">Created Date</div>
                                            </th>
                                            <th scope="col" style="width: 5rem;">
                                            <div class="slds-truncate" title="Type">Type</div>
                                            </th>
                                            <th scope="col" style="width: 3.25rem;">

                                            </th>
                                        </tr>
                                    </thead>
                                        <tbody>
                                        <template lwc:if={isCheckingCoreDocs}>
                                            <tr>
                                                <td colspan="4" class="slds-text-align_center">
                                                    <div class="slds-text-color_weak">{coreDocsStatusMessage}</div>
                                                </td>
                                            </tr>
                                        </template>
                                        <template lwc:else>
                                            <template lwc:if={hasExternalFiles}>
                                                <template for:each={externalFiles} for:item="extFile">
                                                    <tr key={extFile.id}>
                                                        <td>
                                                            <div class="slds-grid slds-grid_vertical-align-center">
                                                                <lightning-icon icon-name="doctype:pdf" size="small" class="slds-m-right_small"></lightning-icon>
                                                                <span class="slds-truncate" title={extFile.name}>{extFile.name}</span>
                                                            </div>
                                                        </td>
                                                        <td>
                                                            <div class="slds-truncate">
                                                                <lightning-formatted-date-time value={extFile.createdDate} year="numeric" month="short" day="2-digit"></lightning-formatted-date-time>
                                                            </div>
                                                        </td> 
                                                        <td>
                                                            <div class="slds-truncate" title={extFile.documentType}>{extFile.documentType}</div>
                                                        </td> 
                                                        <td>
                                                            <lightning-button-icon 
                                                                icon-name="utility:download" 
                                                                variant="brand" 
                                                                onclick={handleDownloadExternalFile} 
                                                                data-locator={extFile.contentLocator}
                                                                data-name={extFile.name}>
                                                            </lightning-button-icon>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                            <template lwc:else>
                                            <tr>
                                                <td colspan="4" class="slds-text-align_center">
                                                    <template lwc:if={hasJsonSnapshot}>
                                                        <lightning-button label="Generate PDF" variant="brand" icon-name="utility:refresh" onclick={handleGenerateAndUploadMissingPdf}></lightning-button>
                                                    </template>
                                                    <template lwc:else>
                                                        <div class="slds-text-color_weak">{coreDocsStatusMessage}</div>
                                                    </template>
                                                </td>
                                            </tr>
                                        </template>
                                        </template>
                                    </tbody>
                                    </table>
                                    
                                </div>
                        </article>

                        <article class="slds-card slds-card_boundary slds-m-bottom_medium">
                          <header class="slds-card__header slds-media slds-media_center">
                              <div class="slds-media__figure">
                                  <lightning-icon icon-name="standard:task" size="small"></lightning-icon>
                              </div>
                              <div class="slds-media__body">
                                  <h2 class="slds-card__header-title"><span>{record.step.urlLabel}</span></h2>
                              </div>
                          </header>
                          <div class="slds-card__body slds-p-around_large">
                              <div class="slds-grid slds-wrap slds-gutters_x-small">
                                  
                                  <div class="slds-col slds-size_2-of-2">
                                      
                                      <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">Approver</p>
                                      <input type="text" class="text-line-task" style="width: 95%;" readonly title={record.approver} value={record.approver} />
                                  </div>

                                  <div class="slds-col slds-size_1-of-2">
                                      <p class="slds-text-title slds-m-bottom_xx-small">Status</p>
                                      <input type="text" class="text-line-task" style="width: 95%;" readonly value={record.status} />
                                      
                                      <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">Start Date</p>
                                      <input type="text" class="text-line-task" style="width: 95%;" readonly value={record.startDate} />

                                      <p class="slds-text-title slds-m-bottom_xx-small">Line/Opportunity Date to Proposal</p>
                                      <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.lineOpportunityDateToProposal} />

                                      
                                  </div>

                                  <div class="slds-col slds-size_1-of-2">
                                      <p class="slds-text-title slds-m-bottom_xx-small">Result</p>
                                      <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.result} />

                                      <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">End Date</p>
                                      <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.endDate} />
                                      
                                      <p class="slds-text-title slds-m-top_small slds-m-bottom_xx-small">User</p>
                                      <input type="text" class="text-line-task" style="width: 100%;" readonly value={record.user} />
                                      
                                      
                                  </div>

                                  <!-- <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                      
                                  </div> -->

                                  <template lwc:if={record.description}>
                                      <div class="slds-col slds-size_1-of-1 slds-m-top_small">
                                          <p class="slds-text-title slds-m-bottom_xx-small">Comments</p>
                                          <div class="slds-form-element__static slds-textarea textarea-line-task slds-scrollable" style="width: 100%;">
                                              {record.description}
                                          </div>
                                      </div>
                                  </template>
                              </div>
                          </div>
                      </article>

                        <article class="slds-card slds-card_boundary ">
                            <header class="slds-card__header slds-media slds-media_center">
                                <div class="slds-media__figure">
                                    <lightning-icon icon-name="standard:case" size="small"></lightning-icon>
                                </div>
                                <div class="slds-media__body">
                                    <h2 class="slds-card__header-title"><span>Case Information</span></h2>
                                </div>
                            </header>
                            <div class="slds-card__body slds-p-top_medium">
                              <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-1">
                                  <div class="slds-p-left_small">
                                    <p class="slds-text-title">Case Description</p>
                                  </div>
                                  <div class="slds-p-around_small">
                                    <div class="slds-form-element__static slds-textarea textarea-line-task slds-scrollable">{caseDescription}</div>
                                  </div>
                                </div>
                              </div>
                            </div>
                        </article>
                    </div>

                    <div class="slds-col slds-size_8-of-12 slds-p-right_medium">
                        <article class="slds-card slds-card_boundary" style="height: 100%; min-height: 73vh; display: flex; flex-direction: column;">
                            
                            <div class="slds-card__body slds-p-around_medium" style="flex-grow: 1; display: flex; flex-direction: column; margin: 0;">
                                
                                <template lwc:if={isLoading}>
                                    <div class="slds-align_absolute-center slds-flex_column" style="flex-grow: 1;">
                                        <p class="slds-text-heading_small slds-m-bottom_medium">Please wait until view is generated...</p>
                                        <lightning-spinner variant="brand" size="medium"></lightning-spinner>
                                    </div>
                                </template>
                                
                                <template lwc:if={showHTML}>
                                    <div class="contentHtml" lwc:dom="manual"></div>
                                </template>
                                
                                <template lwc:if={showPdf}>
                                    <div style="flex-grow: 1; height: 100%; width: 100%;">
                                        <c-preview-pdf pdf-data={pdfData} style="display: block; height: 100%;"></c-preview-pdf>
                                    </div>
                                </template>
                                
                            </div>
                        </article>
                    </div>
                </div>
                    
                <c-pdf-generator></c-pdf-generator>
              <template lwc:if={showErrorPdf}>
                  <div class="slds-align_absolute-center" style="position: absolute; z-index: 10001; top: 40%; width: 100%;">
                      <div class="slds-box slds-theme_default slds-text-align_center slds-p-around_large" style="box-shadow: 0 4px 20px rgba(0,0,0,0.15);">
                          <lightning-icon icon-name="utility:error" size="large" variant="error"></lightning-icon>
                          <p class="slds-text-heading_medium slds-m-top_medium">Step's template not found.</p>
                          <p class="slds-text-color_weak">Please contact the administrator.</p>
                      </div>
                  </div>
              </template>

              </div>
            </div>
            <footer class="slds-modal__footer">
              <lightning-button
                label="Close"
                onclick={closeModal}
                disabled={closeButtonDisabled}
              ></lightning-button>
          </footer>
        </div>
    </section>    
</template>
