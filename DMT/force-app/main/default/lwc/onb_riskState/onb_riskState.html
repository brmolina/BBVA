<template>
     <lightning-card>
        <div class="slds-p-around_small">
            <template if:true={showFundsRiskToolbarWarning}>
                <div class="slds-m-bottom_medium">
                    <c-onb_autosave-banner-notification
                        icon="utility:warning"
                        menssage={label.ONB_RISK_TOOLBAR_MSG}
                        variant="warning">
                    </c-onb_autosave-banner-notification>
                </div>
            </template>

            <!--RISK CLIENT CONTACT-->
                <div class="onb-group slds-m-top_medium">
                    <div class="onb-row onb-row-two">
                        <div class="onb-card onb-card-inside-group">
                            <c-onb_onboarding-form
                                object-api-name={objContactApiName}
                                record-id={externalContactId}
                                title={label.ONB_RISK_CLIENT_CONTACT}
                                field-names={sections.riskClientContactLeft.fields}
                                field-custom-labels={sections.riskClientContactLeft.labels}
                                field-rules={rules.riskClientContactLeft}
                                handle-save-on-wrapper="true"
                                onvaluechange={handleContactFieldChange}>
                            </c-onb_onboarding-form>
                        </div>

                        <div class="onb-card onb-card-inside-group">
                            <c-onb_onboarding-form
                                object-api-name={objContactApiName}
                                record-id={externalContactId}
                                field-names={sections.riskClientContactRight.fields}
                                field-custom-labels={sections.riskClientContactRight.labels}
                                field-rules={rules.riskClientContactRight}
                                handle-save-on-wrapper="true"
                                onvaluechange={handleContactFieldChange}>
                            </c-onb_onboarding-form>
                        </div>
                    </div>
                </div>
            <!--RISK LINES COMPONENT-->
            <template if:true={showRiskLinesComponent}>
                <div class="slds-m-top_large">
                    <c-onb_risk-lines
                        record-id={recordId}>
                    </c-onb_risk-lines>
                </div>
            </template>

            <template if:true={showFundsRiskTable}>
                <div class="slds-m-top_large">
                    <c-onb_onboarding-table
                        title="Funds Risk Lines"
                        empty-state-message={noFundsMessage}
                        record-id={recordId}
                        object-api-name={fundsTableObjectApiName}
                        columns={fundsTableColumns}
                        initial-rows={fundsRowsForTable}
                        show-aux-button=true
                        actions-column-position="end"
                        actions-column-label="Lines"
                        row-read-only-when={rowReadOnlyWhen}
                        onauxbuttonrow={handleFundLinesRow}>
                    </c-onb_onboarding-table>
                </div>
            </template>
        </div>
     </lightning-card>
</template>
