<template>
    <!-- === Encabezado === -->
    <lightning-modal-header label={titleText}></lightning-modal-header>

    <!-- === Cuerpo === -->
    <lightning-modal-body>
        <section class={layoutClass}>
            <!-- Columna de chat -->
            <div class="chat-column">
                <!-- Barra de acciones del encabezado -->
                <div class="chat-header-actions">
                    <template if:true={showRequestReportButton}>
                        <button class="request-report-button" onclick={handleRequestReport} title={reportButtonLabel} disabled={isRequestReportDisabled}>
                            {reportButtonLabel}
                        </button>
                    </template>
                    <template if:true={showSummaryButton}>
                        <button class="summary-toggle-button" onclick={handleSummaryToggle} title="Open Summary">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M15 4V20M10 10L8 12L10 14M4 6C4 5.46957 4.21071 4.96086 4.58579 4.58579C4.96086 4.21071 5.46957 4 6 4H18C18.5304 4 19.0391 4.21071 19.4142 4.58579C19.7893 4.96086 20 5.46957 20 6V18C20 18.5304 19.7893 19.0391 19.4142 19.4142C19.0391 19.7893 18.5304 20 18 20H6C5.46957 20 4.96086 19.7891 4.58579 19.4142C4.21071 19.0391 4 18.5304 4 18V6Z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </template>
                </div>
                <div class="messages-wrapper">
                    <c-ai-chat-robot2-message-list
                        messages={displayMessages}
                        is-thinking={isThinking}
                        conversation-id={conversationId}
                        user-id={userKey}
                        user-country={userCountry}
                        user-segment={userSegment}
                        onsuggestionselect={handleSuggestionSelect}
                        onfeedback={handleFeedback}
                        oncopied={handleCopied}
                        onfeedbacksent={handleFeedbackSent}
                    ></c-ai-chat-robot2-message-list>
                </div>
                <div class="input-sticky">
                    <div class="input-wrapper">
                        <c-ai-chat-robot2-input
                            disabled={inputDisabled}
                            char-limit={charLimit}
                            onmessagesend={handleSend}
                        ></c-ai-chat-robot2-input>
                        <div class="language-selector-slot">
                            <template if:true={showLanguageSelector}>
                                <c-ai-chat-robot2-language-selector
                                    onlanguagechange={handleLanguageChange}
                                ></c-ai-chat-robot2-language-selector>
                            </template>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Barra lateral de resumen (derecha) -->
            <c-ai-chat-robot2-summary-view
                class="summary-column"
                onclose={handleSummaryClose}
                onresize={handleSummaryResize}
            ></c-ai-chat-robot2-summary-view>
        </section>
    </lightning-modal-body>
</template>
