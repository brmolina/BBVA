<template>
    <article class="slds-card slds-card_boundary" style=" height: 11rem; overflow-y: auto;" >
        <div class="slds-card__header slds-grid">
            <header class="slds-media slds-media_center slds-has-flexi-truncate">
              <div class="slds-media__figure">
                    <lightning-icon icon-name="standard:file" alternative-text="Files Icon" size="small" class="slds-m-right_x-small"></lightning-icon>
              </div>
              <div class="slds-media__body">
                <h2 class="slds-card__header-title">
                  <a href="#" class="slds-card__header-link slds-truncate" title="Task files">
                    <span>Task files</span>
                  </a>
                </h2>
              </div>
            </header>
          </div>
          <div class="slds-card__body">
        <template if:true={files}>
            <div class="slds-scrollable_y">
                <table aria-describedby="uploadTableDocument" class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-text-title_caps">
                            <th scope="col">
                                <div class="slds-truncate" title="File Name">Name</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="File Name">Created date</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="File Type">Type</div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={files} for:item="file">
                            <tr key={file.contentDocumentId}>
                                <td>
                                    <div class="slds-truncate" title={file.title}>
                                        <a href="javascript:void(0);" data-id={file.contentDocumentId} onclick={handleOpenFileClick}>
                                            <template lwc:if={file.isTemplateView}>Task view
                                                <lightning-icon icon-name="utility:document_preview" size="small" alternative-text="Preview task details" style="--slds-c-icon-color-foreground-default: #49A5E6; margin-left: 1rem;"></lightning-icon>
                                            </template>
                                            <template lwc:else>{file.title}</template>
                                            
                                        </a>
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title={file.createdDate}>
                                        <lightning-formatted-date-time value={file.createdDate} year="numeric" month="numeric" day="numeric" hour="2-digit" minute="2-digit" hour12="false"></lightning-formatted-date-time>
                                    </div>
                                </td>
                                <td>
                                    <div class="slds-truncate" title={file.fileType}>{file.fileType}</div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
        <template if:true={error}>
            <p class="slds-text-color_error">{error}</p>
        </template>
    </div>
    </article>
</template>
