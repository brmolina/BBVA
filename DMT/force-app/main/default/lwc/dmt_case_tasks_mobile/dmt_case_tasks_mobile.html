<template>
    <template lwc:if={isDataReceived}>
        <div class="mobile-container">
            <div class="mobile-header">
                <div class="mobile-header-title">{labels.DMT_TaskInProgress}</div>
                <div class="mobile-search">
                    <c-search-bar-datatable is-lwc="true" info-name={allFlatDataForSearch} ondatasearch={handleSearch}>
                    </c-search-bar-datatable>
                </div>
            </div>

            <div class="mobile-content">
                <template lwc:if={isFiltering}>
                    <div class="spinner-overlay">
                        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
                    </div>
                </template>

                <template lwc:if={hasData}>
                    <div class="mobile-table-scroll" onscroll={handleScroll}>
                        <table class="mobile-table">
                            <thead>
                                <tr>
                                    <th>Task Name</th>
                                    <th>Client</th>
                                    <th>Opportunity Name</th>
                                    <th>Opportunity Code</th>
                                </tr>
                            </thead>
                            <tbody>
                                <template for:each={displayedRows} for:item="row">
                                    <tr key={row.key}>
                                        <td data-label="Task Name">
                                            <template lwc:if={row.isTaskLink}>
                                                <lightning-formatted-url value={row.taskUrl} label={row.taskLabel}
                                                    tooltip={row.taskLabel} class="cell-link">
                                                </lightning-formatted-url>
                                            </template>
                                            <template lwc:else>
                                                <span class="cell-text" title={row.taskLabel}>{row.taskLabel}</span>
                                            </template>
                                        </td>
                                        <td data-label="Client">
                                            <span class="cell-text" title={row.client}>{row.client}</span>
                                        </td>
                                        <td data-label="Opportunity Name">
                                            <template lwc:if={row.isOppLink}>
                                                <lightning-formatted-url value={row.oppUrl} label={row.oppLabel}
                                                    tooltip={row.oppLabel} class="cell-link">
                                                </lightning-formatted-url>
                                            </template>
                                            <template lwc:else>
                                                <span class="cell-text" title={row.oppLabel}>{row.oppLabel}</span>
                                            </template>
                                        </td>
                                        <td data-label="Opportunity Code">
                                            <span class="cell-text" title={row.code}>{row.code}</span>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                </template>
                <template lwc:else>
                    <div class="no-data">{labels.DMT_No_Records}</div>
                </template>
            </div>
        </div>
    </template>
    <template lwc:else>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
</template>
