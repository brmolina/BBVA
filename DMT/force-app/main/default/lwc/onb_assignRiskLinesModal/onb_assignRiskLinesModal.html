<template>
    <lightning-modal-header>
        <div class="slds-text-heading_medium">{header}</div>
    </lightning-modal-header>

    <lightning-modal-body>
        <c-onb_risk-lines
            force-show-risk-tables
            record-id={recordOnboardingId}
            fund-id={fundId}>
        </c-onb_risk-lines>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            variant="neutral"
            label="Accept"
            onclick={handleClose}>
        </lightning-button>
    </lightning-modal-footer>
</template>
