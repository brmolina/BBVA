<template>

    <!-- SPINNER -->
    <!-- div>
        <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
    </div -->

    <!-- MAIN TABLE -->
    <div >
        <template lwc:if={showSpinner}>
            <div>
                <lightning-spinner class="spins"  alternative-text="Loading" size="medium"></lightning-spinner>
            </div>
        </template>
        <template lwc:if={errorLoading}>
            <c-dmt_show-popover style="margin-top: 2rem;margin-left: 18rem;display: flex;" show-popover={errorLoading} variant="error" header="We hit a snag." message-title="Error occur while retrieving client data." message="Please try again later"></c-dmt_show-popover>
         </template>
         <template lwc:else>
            
            <div style="position: relative; ">
                <div class='slds-scrollable table_height' onscroll={handleScroll} >
                    <table data-id="mainTable" class="slds-table slds-table--bordered slds-box slds-max-medium-table--stacked-horizontal custom-table" role="grid" aria-label="dmttable">

                        <!-- TABLE HEADERS -->
                        <thead>
                            <tr class="slds-line-height--reset">
                                <template iterator:col={visibleColumns}>
                                    <template lwc:if={col.first}>
                                        <th key={col.value.field} data-id="mainTableColumn" width={col.value.initialWidth} class='slds-is-sortable _slds-is-resizable slds-text-title--caps fixed-header fixed-row-header' scope="col">
                                            <span class="slds-truncate" title={col.value.title}><lightning-formatted-rich-text value={col.value.label}></lightning-formatted-rich-text></span>
                                            <div class="lineLeft" onclick={scrollLeft} onmousemove={showArrowLeft} onmouseleave={hideArrow}>
                                                <span class="arrowCustom"><lightning-icon icon-name="utility:chevronleft" size="x-small"></lightning-icon></span>
                                            </div>

                                        </th>
                                    </template>
                                    <template lwc:else>
                                        <th key={col.value.field} data-id="mainTableColumn" width={col.value.initialWidth} class='slds-is-sortable _slds-is-resizable slds-text-title--caps fixed-header' scope="col">
                                            <template lwc:if={doubleLineHeader}>
                                                <span class="slds-truncate" title={col.value.title}><lightning-formatted-rich-text value={col.value.label}></lightning-formatted-rich-text><br/>{selectedGrillField}</span>
                                            </template>
                                            <template lwc:else>
                                                <span class="slds-truncate" title={col.value.title}><lightning-formatted-rich-text value={col.value.label}></lightning-formatted-rich-text></span>
                                            </template>
                                        </th>
                                    </template>
                                </template>
                            </tr>
                        </thead>

                        <!-- TABLE BODY -->
                        <tbody data-id="container">
                            <!-- GROUPS -->
                            <template iterator:group={selectedData.groups}>
                                <!-- GROUP-->
                                
                                <template iterator:l3group={group.value.l3groups} >
                                    <!-- L3 GROUPS-->
                                    <tr key={nextIteratorKey} data-id="mainTableRow" id={l3group.value.level3GroupId} data-subgroup={l3group.value.subGroupId} class="slds-hint-parent group slds-theme_shade collapsed l3collapsed">
                                        <template iterator:col={visibleColumns}>
                                            <template lwc:if={col.first}>
                                                <td key={iteratorKey} data-id={l3group.value.level3GroupId} id={l3group.value.level3GroupId} class="l3GroupName fixed-row-name" role="gridcell" onclick={handleToggleGroup}>
                                                    <div class="slds-truncate" id={l3group.value.level3GroupId} title={l3group.value.Name}>
                                                        <c-dmt_main_table_cell_products row={l3group.value} index={col.index} column={col.value} tab={selectedTab} cellid={l3group.value.level3GroupId} selectedcell={priorselectedRows}  ></c-dmt_main_table_cell_products>
                                                    </div>
                                                </td>
                                            </template>
                                            <template lwc:else>
                                                <td key={iteratorKey}>-</td>
                                            </template>
                                        </template>
                                    </tr>
                                    <!-- L3 CLIENTS -->
                                    <template iterator:client={l3group.value.clients}>
                                    
                                    </template>
                                </template>
                                <!-- GROUP CLIENTS -->
                                <template iterator:client={group.value.clients}>
                                    
                                </template>
                            </template>
                            <!-- TOP LEVEL CLIENTS -->
                            <template iterator:client={selectedData.toplevel.clients} >
                                <tr key={nextIteratorKey} data-id={client.value.customerId} onclick={selectRowComplete}>
                                    <template iterator:col={visibleColumns}>
                                        <template lwc:if={col.first}>
                                            <td key={iteratorKey} id={iteratorKey} data-id={client.value.customerId} class={client.classCell} role="gridcell">
                                                <c-dmt_main_table_cell_products  data-customerid={customerId} data-id={client.value.customerId}  row={client.value.data} index={col.index} column={col.value} tab={selectedTab} cellid={iteratorKey} selectedcell={priorselectedRows} currencyrow={currency}  onupdatemainholder={handleMainHolderSelection}></c-dmt_main_table_cell_products>
                                            </td>
                                        </template>
                                        <template lwc:else>
                                            <td key={iteratorKey} id={iteratorKey} data-id={client.value.customerId} role="gridcell" class={client.classCell}>
                                                <c-dmt_main_table_cell_products data-id={client.value.customerId} row={client.value.data} index={col.index} column={col.value} tab={selectedTab} cellid={iteratorKey} selectedcell={priorselectedRows}  currencyrow={currency} ></c-dmt_main_table_cell_products>
                                            </td>
                                        </template>
                                    </template>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                    <template if:true={showFooter}>
                        <div class="slds-clearfix slds-p-around_medium slds-border_top slds-text-align_center footer">
                        <div class="slds-float_center slds-m-top_x-small slds-m-bottom_x-small ">
                        <lightning-button variant="neutral" label="Cancel" onclick={handleCancel}></lightning-button>
                        <lightning-button variant="brand" label="Save" class="slds-m-left_small" onclick={handleSave}></lightning-button>
                        </div>
                        </div>
                    </template>

                </div>
                <div class="lineRight" onclick={scrollRight} onmousemove={showArrowRight} onmouseleave={hideArrow}>
                        <span class="arrowCustom"><lightning-icon icon-name="utility:chevronright"  size="x-small"></lightning-icon></span>
                </div>
            </div>

        </template>
    </div>
    {body}
    <c-hpg_fetcher onfetchmore={handleFetchMoreEvent}></c-hpg_fetcher>
</template>
