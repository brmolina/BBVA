<template>
    <div class="slds-box slds-theme_default">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Cargando..."
                size="medium"></lightning-spinner>
        </template>

        <div class="slds-grid slds-wrap slds-gutters slds-align_center">

            <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium">
                <lightning-card title="Refresh flexcards recientes (24h)">
                    <div class="slds-p-around_medium">
                        <p class="slds-text-body_regular slds-m-bottom_medium">Opción principal: refresca solo flexcards modificadas en las últimas 24 horas.</p>
                        <div class="slds-align_absolute-center">
                            <lightning-button
                                variant="brand"
                                label="Refresh recent"
                                onclick={handleRefreshRecent}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-card>
            </div>

            <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium">
                <lightning-card title="Acciones legacy">
                    <div class="slds-p-around_medium slds-align_absolute-center">
                        <lightning-button
                            variant="base"
                            label={legacyToggleLabel}
                            onclick={handleToggleLegacyActions}>
                        </lightning-button>
                    </div>
                </lightning-card>
            </div>

            <template if:true={showLegacyActions}>
            <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium">
                <lightning-card title="Refresh all flexcards (Latest Version)">
                    <div class="slds-p-around_medium">
                        <p class="slds-text-body_regular slds-m-bottom_medium">Úsalo solo cuando necesites recompilar todas las flexcards.</p>
                        <div class="slds-align_absolute-center">
                            <lightning-button
                                variant="neutral"
                                label="Refresh all"
                                onclick={handleRefresh}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-card>
            </div>

            <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium">
                <lightning-card title="Refresh unique flexcard">
                    <div class="slds-p-around_medium">
                        <span
                            class="slds-text-title_caps slds-page-header__title">Flexcard
                            Name</span>
                        <c-searchable-combobox class="slds-col"
                            pick-list-ordered={optionsFlexcards}
                            selected-searchlabel={selectedFlexcard.label}
                            selected-searchvalue={selectedFlexcard.value}
                            oncomboboxchange={handleChangeFlexcard}
                            context="selectedFlexcardValue"
                            selected-search-change={searchFlexcard.label}></c-searchable-combobox>

                        <span
                            class="slds-text-title_caps slds-page-header__title">Version
                            Number</span>
                        <c-searchable-combobox class="slds-col"
                            pick-list-ordered={optionsVersionNumFlexcards}
                            changeread={isVersionNumFlexcardDisabled}
                            selected-searchlabel={selectedVersionNumFlexcard.label}
                            selected-searchvalue={selectedVersionNumFlexcard.value}
                            oncomboboxchange={handleChangeVersionNumFlexcard}
                            context="selectedFlexcardId"
                            selected-search-change={searchVersionNumFlexcard.label}></c-searchable-combobox>

                        <div class="slds-align_absolute-center">
                            <lightning-button
                                variant="brand"
                                label="Refresh"
                                disabled={isButtonFlexcardDisabled}
                                onclick={handleRefreshFlexcard}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-card>
            </div>

            <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3">
                <lightning-card title="Refresh IP">
                    <div class="slds-p-around_medium">
                        <span
                            class="slds-text-title_caps slds-page-header__title"
                            data-aura-rendered-by="135:1905;a">Integration
                            Procedure Name</span>
                        <c-searchable-combobox class="slds-col"
                            pick-list-ordered={optionsIPs}
                            selected-searchlabel={selectedIP.label}
                            selected-searchvalue={selectedIP.value}
                            oncomboboxchange={handleChangeIP}
                            context="integProc"
                            selected-search-change={searchIP.label}></c-searchable-combobox>

                        <span
                            class="slds-text-title_caps slds-page-header__title"
                            data-aura-rendered-by="135:1905;a">Version
                            Number</span>
                        <c-searchable-combobox class="slds-col"
                            pick-list-ordered={optionsVersionNumIP}
                            changeread={isVersionNumIPDisabled}
                            selected-searchlabel={selectedVersionNumIP.label}
                            selected-searchvalue={selectedVersionNumIP.value}
                            oncomboboxchange={handleChangeVersionNumIP}
                            context="integProc"
                            selected-search-change={searchVersionNumIP.label}></c-searchable-combobox>

                        <div class="slds-align_absolute-center">
                            <lightning-button
                                variant="brand"
                                label="Refresh"
                                disabled={isButtonIPDisabled}
                                onclick={handleRefreshIP}>
                            </lightning-button>
                        </div>
                    </div>
                </lightning-card>
            </div>
            </template>

        </div>
    </div>
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true"
            aria-labelledby="modal-heading-01"
            class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <h2 id="modal-heading-01"
                        class="slds-modal__title slds-hyphenate">{modalTitle}</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium"
                    id="modal-content-id-1">
                    <div
                        class="slds-scoped-notification slds-media slds-media_center slds-theme_warning"
                        role="status">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="utility:warning"
                                alternative-text="Warning!" variant="inverse"
                                size="small"></lightning-icon>
                        </div>
                        <div class="slds-media__body">
                            <p class="slds-text-heading_large">{modalDescription}</p>
                            <p class="slds-text-heading_large slds-m-top_small">Ten en cuenta las
                                siguientes consideraciones:</p>
                            <ul
                                class="slds-list_dotted slds-m-left_large slds-m-top_x-small">
                                <template for:each={modalConsiderations} for:item="consideration">
                                    <li key={consideration.id} class="slds-text-heading_large">{consideration.text}</li>
                                </template>

                            </ul>
                        </div>
                    </div>

                    <lightning-input
                        type="checkbox"
                        label="He leído y cumplo las condiciones."
                        checked={isCheckboxChecked}
                        onchange={handleCheckboxChange}
                        class="slds-m-top_medium">
                    </lightning-input>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancelar" title="Cancelar"
                        onclick={handleCancel}
                        class="slds-m-left_x-small"></lightning-button>
                    <lightning-button
                        variant="brand"
                        label="Continuar"
                        title="Continuar"
                        onclick={handleConfirmRefresh}
                        disabled={isConfirmButtonDisabled}
                        class="slds-m-left_x-small">
                    </lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
</template>
