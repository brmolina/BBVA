<template>
    <lightning-modal-header>
        <div class="slds-text-heading_medium">{header}</div>
    </lightning-modal-header>

    <lightning-modal-body>
        <p>{message}</p>
    </lightning-modal-body>

    <lightning-modal-footer>
        <lightning-button
            variant="neutral"
            label={cancelLabel}
            onclick={handleCancel}>
        </lightning-button>

        <lightning-button
            class="slds-m-left_small"
            variant="brand"
            label={confirmLabel}
            onclick={handleConfirm}>
        </lightning-button>
    </lightning-modal-footer>
</template>
