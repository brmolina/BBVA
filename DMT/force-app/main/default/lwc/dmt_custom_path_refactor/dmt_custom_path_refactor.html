<template>
    <article class="slds-card">
        <div class="slds-card__body slds-card__body_inner">
            <div class="slds-path">
                <div class="slds-grid slds-path__track">
                    <div class="slds-grid slds-path__scroller-container">
                        <div class="slds-path__scroller">
                            <div class="slds-path__scroller_inner">
                                <lightning-progress-indicator
                                    current-step={status}
                                    variant="base"
                                    type="path">
                                    <template for:each={stages}
                                        for:item="stage">
                                        <lightning-progress-step
                                            key={stage}
                                            label={stage}
                                            value={stage}
                                            onclick={handleStageClick}>
                                        </lightning-progress-step>
                                    </template>
                                </lightning-progress-indicator>
                            </div>
                        </div>

                        <div class="slds-grid slds-path__action">
                            <lightning-button
                                class="fixed-button"
                                label={buttonLabel}
                                variant="brand"
                                icon-name={buttonIcon}
                                onclick={handleMarkComplete}
                                disabled={isDisabled}>
                            </lightning-button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <template lwc:if={showModal}>
            <section role="dialog" tabindex="-1"
                class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Won/Lost</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-combobox
                            label="Won/Lost"
                            value={wonLostValue}
                            options={wonLostOptions}
                            onchange={handleWonLostChange}>
                        </lightning-combobox>
                    </div>
                    <lightning-modal-footer>
                        <lightning-button
                            label="Cancel"
                            onclick={closeModal}
                            class="slds-var-p-right_x-small">
                        </lightning-button>
                        <lightning-button
                            label="Save"
                            variant="brand"
                            onclick={saveModal}
                            class="slds-var-p-right_x-small">
                        </lightning-button>
                    </lightning-modal-footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </article>
</template>
