<template>
    <template if:true={showPopovervalue}>
    <div style="flex-direction:column"> 
    <template if:true={error}>
        <template if:true={showError}>
        <div style="display: flex;justify-content:right;margin-right:-9.2rem">
        <section aria-describedby="dialog-body-id-109" aria-labelledby="dialog-heading-id-1" class="slds-popover slds-popover_error slds-nubbin_bottom slds-size_large" role="dialog">
            <button class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close slds-button_icon-inverse" title="Close dialog" onclick={onClickClose} >
                <lightning-icon style="padding-top: 0.1rem;" id="icon-close" size="xx-small" icon-name="utility:close" variant="inverse"></lightning-icon>
            <span class="slds-assistive-text">Close dialog</span>
            </button>
            <header class="slds-popover__header">
            <div class="slds-media slds-media_center slds-has-flexi-truncate ">         
            <lightning-icon style="padding-right: 0.65rem;" id="icon-error" size="x-small" icon-name="utility:error" variant="inverse"></lightning-icon>
            <div class="slds-media__body">
            <h2 class="slds-truncate slds-text-heading_medium" id="dialog-heading-id-1" title={header}>{header}</h2>
            </div>
            </div>
            </header>
            <div id="content_774:0" class="panel-content scrollable" data-aura-rendered-by="783:0" data-scoped-scroll="true">   
                    <div lwc-1v0sjpqissb="" class="slds-popover__body">
                        <div lwc-1v0sjpqissb="" class="pageLevelErrors">
                            <div class="genericNotification" lwc-1v0sjpqissb="">
                                <strong lwc-1v0sjpqissb="">{messageTitle}</strong>
                            </div>
                            <ul lwc-1v0sjpqissb="" class="errorsList slds-list_dotted slds-m-left_medium">
                                <li lwc-1v0sjpqissb="" style="width: 40ch;">{message}</li>
                            </ul></div></div></div>
            </section>
        </div>
        <div  style="display: flex;justify-content:right">
        <lightning-icon onclick={onClickIcon} size="small" variant="error" style="margin-right: 2.5rem; margin-top:1rem" icon-name="utility:error" title="Error" class="footer-button page-error-button slds-button slds-button_icon-error slds-m-right_small" aria-haspopup="dialog" data-proxy-id="aura-pos-lib-1" id="footer"></lightning-icon>
        </div>
    </template>
    <template if:false={showError}>
    <div  style="display: flex;justify-content:right; margin-top:6.18rem; margin-left:9.1rem">
    <lightning-icon onclick={onClickIcon} size="small" variant="error" style="margin-right: 0; margin-top:1rem" icon-name="utility:error" title="Error" class="footer-button page-error-button slds-button slds-button_icon-error slds-m-right_small" aria-haspopup="dialog" data-proxy-id="aura-pos-lib-1" id="footerclose"></lightning-icon>
    </div>
    </template>
</template>
<template if:true={warning}>
    <template if:true={showWarning}>
    <div style="display: flex;justify-content:right;margin-right:-9.2rem">
    <section aria-describedby="dialog-body-id-109" aria-labelledby="dialog-heading-id-1" class="slds-popover slds-popover_warning slds-nubbin_bottom slds-size_large"  role="dialog">
        <button class="slds-button slds-button_icon slds-button_icon-small slds-float_right slds-popover__close slds-button_icon-inverse" title="Close dialog" onclick={onClickClose} >
            <lightning-icon style="padding-top: 0.1rem;" id="icon-warning-close" size="xx-small" icon-name="utility:close" variant="inverse"></lightning-icon>
        <span class="slds-assistive-text">Close dialog</span>
        </button>
        <header class="slds-popover__header">
        <div class="slds-media slds-media_center slds-has-flexi-truncate ">         
        <lightning-icon style="padding-right: 0.65rem;" id="icon-warning" size="x-small" icon-name="utility:warning" variant="inverse"></lightning-icon>
        <div class="slds-media__body">
        <h2 class="slds-truncate slds-text-heading_medium" id="dialog-heading-id-2" title={header}>{header}</h2>
        </div>
        </div>
        </header>
        <div id="warning-id" class="panel-content scrollable" data-aura-rendered-by="783:0" data-scoped-scroll="true">   
                <div lwc-1v0sjpqissb="" class="slds-popover__body">

                        <div class="genericNotification" lwc-1v0sjpqissb="">

                        <ul lwc-1v0sjpqissb="" class="errorsList slds-list_dotted slds-m-left_medium">
                            <li lwc-1v0sjpqissb="">{message}</li>
                        </ul></div></div></div>
        </section>
    </div>
    <div  style="display: flex;justify-content:right">
    <lightning-icon onclick={onClickIcon} size="small" variant="warning" style="margin-right: 0; margin-top:1rem" icon-name="utility:warning" title="warning" class="footer-button page-warning-button slds-button slds-button_icon-warning slds-m-right_small" aria-haspopup="dialog" data-proxy-id="aura-pos-lib-1" id="footer-warning"></lightning-icon>
    </div>
</template>
<template if:false={showWarning}>

    </div>
    </template>
</template>
