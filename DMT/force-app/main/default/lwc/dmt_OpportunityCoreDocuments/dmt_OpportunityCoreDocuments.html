<template>
    <lightning-card title="Documents" icon-name="standard:file">

        <div slot="actions">
            <lightning-button
                label="Upload Document"
                icon-name="utility:upload"
                variant="brand"
                onclick={handleUploadClick}
                disabled={isUploadDisabled}>
            </lightning-button>
        </div>

        <div class="slds-p-around_medium drop-zone"
             ondragover={handleDragOver}
             ondragleave={handleDragLeave}
             ondrop={handleDrop}>

            <template if:true={isDragging}>
                <div class="drop-overlay">
                    <div class="slds-text-heading_medium">Drop file here to upload</div>
                </div>
            </template>

            <template if:true={isLoading}>
                <lightning-spinner alternative-text="Loading..."></lightning-spinner>
            </template>

            <template if:true={hasFiles}>
                <div style="height: 300px;">
                    <lightning-datatable
                        key-field="id"
                        data={files}
                        columns={columns}
                        onrowaction={handleRowAction}
                        hide-checkbox-column>
                    </lightning-datatable>
                </div>
            </template>

            <template if:false={hasFiles}>
                <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                    No documents found. Drop a file here to upload.
                </div>
            </template>
        </div>
    </lightning-card>

    <input
        type="file"
        class="hidden-file-input"
        style="display:none"
        onchange={handleFileSelected}
    />

    <!-- Upload Modal -->
    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open" aria-modal="true">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleModalCancel}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse" size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 class="slds-text-heading_medium slds-hyphenate">Upload Document</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <div class="slds-form slds-form_stacked">

                        <template if:false={selectedFile}>
                            <div class="slds-align_absolute-center slds-p-vertical_large">
                                <lightning-button
                                    label="Select File"
                                    icon-name="utility:upload"
                                    onclick={handleModalSelectFile}>
                                </lightning-button>
                            </div>
                        </template>

                        <template if:true={selectedFile}>
                            <div class="slds-form-element">
                                <label class="slds-form-element__label">Selected File</label>
                                <div class="slds-form-element__control">
                                    <div class="slds-box slds-box_x-small slds-theme_shade slds-grid slds-grid_vertical-align-center">
                                        <lightning-icon icon-name="doctype:attachment" size="small" class="slds-m-right_small"></lightning-icon>
                                        <span class="slds-truncate slds-grow">{selectedFileName}</span>
                                        <lightning-button-icon
                                            icon-name="utility:close"
                                            variant="bare"
                                            alternative-text="Remove file"
                                            class="slds-m-left_small"
                                            onclick={handleModalSelectFile}
                                            title="Change file">
                                        </lightning-button-icon>
                                    </div>
                                </div>
                            </div>
                            <lightning-combobox
                                name="docType"
                                label="Document Type"
                                value={selectedDocType}
                                placeholder="Select Document Type"
                                options={docTypeOptions}
                                onchange={handleDocTypeChange}
                                required>
                            </lightning-combobox>
                        </template>

                    </div>
                </div>
                <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={handleModalCancel}>Cancel</button>
                    <button class="slds-button slds-button_brand" onclick={handleModalUpload} disabled={isModalUploadDisabled}>Upload</button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
