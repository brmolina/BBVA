<template>
    <lightning-card>
        <template lwc:if={isOpen}>
                <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" class="slds-modal slds-fade-in-open slds-modal_large">
                    <div class="slds-modal__container" >
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <div class="slds-modal__content slds-p-around_medium full-height-content">
                            <c-dmt_screen_view_management
                                is-opp-screen-view={isOppScreenView}
                                record-id={recordId}>
                            </c-dmt_screen_view_management>
                        </div>
                    </div>
                </section>
                <div class="slds-backdrop slds-backdrop_open"></div>
            </template>
    </lightning-card>
</template>
