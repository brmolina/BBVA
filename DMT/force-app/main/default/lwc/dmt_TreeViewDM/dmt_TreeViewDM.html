<template>
    <div class="main-wrapper">
        <div class="slds-card slds-theme_default slds-p-around_none container-custom">
            <div class={expandedClasses}>
                <div
                    class="slds-p-left_x-small  slds-p-right_medium slds-p-top_medium slds-grid slds-grid_vertical-align-center header-section">
                    <div class="slds-media slds-media_center slds-no-space slds-grow slds-p-left_small">
                        <div class="slds-media__figure">
                            <lightning-icon icon-name="action:new_account" style="cursor:pointer;"
                                onclick={goToClientRecord} size="small">
                            </lightning-icon>
                        </div>

                        <div class="slds-media__body">
                            <h2 class="slds-text-heading_small slds-truncate" title={groupname}>
                                <strong onclick={goToClientRecord} class="slds-card__header-link"
                                    style="cursor:pointer;">
                                    {groupname}
                                </strong>
                            </h2>

                            <!-- Group code subtitle -->
                            <p class="slds-text-body_small slds-text-color_weak slds-truncate" title={groupcode}>
                                {groupcode}
                            </p>
                        </div>
                    </div>

                    <div class="slds-no-flex slds-grid slds-grid_vertical-align-center" style="gap: 8px;">
                        <!-- Help como icono separado -->
                        <button class="slds-button slds-button_neutral custom-button" onclick={goToGCE}>
                            <img src="/resource/DMTMarco_GCE" alt={label.goToGCEText} class="custom-icon" />
                            {label.goToGCEText}
                        </button>

                        <lightning-button-icon icon-name="utility:chevronleft" class="slds-icon_medium"
                            alternative-text={toggleLabel} variant="bare" size="medium" onclick={togglePanel}>
                        </lightning-button-icon>
                    </div>
                </div>

                <div class="slds-p-left_small slds-p-right_xx-small">
                    <!-- Search and filter controls -->
                    <lightning-layout multiple-rows>
                        <!-- Text search for clients -->
                        <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                            <lightning-input type="search" label={label.searchClientsText}
                                placeholder={label.searchClientsTextWhithTreePoints} value={searchValue}
                                onchange={handleInputChange}>
                            </lightning-input>
                        </lightning-layout-item>

                        <!-- Filter by exposure type -->
                        <lightning-layout-item size="12" medium-device-size="6" padding="around-small">
                            <lightning-combobox label={label.clientsFilterText} value={filterValue}
                                placeholder={label.selectFilterText} options={filterOptions}
                                onchange={handleFilterChange}>
                            </lightning-combobox>
                        </lightning-layout-item>
                    </lightning-layout>
                </div>

                <div class="slds-p-left_large ">
                    <!-- Data reference date -->
                    <div class="slds-text-body_small">{label.dataFromText} {searchdate}</div>
                </div>
            </div>

            <div class={collapsedClasses}>
                <div class="slds-card__header slds-grid collapsed-wrapper">
                    <!-- Expand button -->
                    <lightning-button-icon icon-name="utility:chevronright" alternative-text={toggleLabel}
                        variant="bare" size="medium" onclick={togglePanel}>
                    </lightning-button-icon>

                    <!-- Client record shortcut -->
                    <lightning-icon class="custom-header-button" icon-name="standard:account_info"
                        alternative-text={label.goToClientInfoText} size="medium" title={label.goToClientInfoText}
                        onclick={goToClientRecord}>
                    </lightning-icon>

                    <!-- GCE shortcut (collapsed icon) -->
                    <span class="slds-icon_container slds-icon-standard-survey custom-header-button"
                        title={label.goToGCEText} onclick={goToGCE}>
                        <span class="slds-icon slds-icon_medium slds-grid slds-grid_align-center slds-grid_vertical-align-center">
                            <img src={iconMarcoGCE} class="custom-gce-icon" alt={label.goToGCEText} />
                        </span>
                    </span>
                </div>
            </div>

            <div class={hideElements}  >
                <c-dmt_-main-client-selection-table class="table-flex" client-id={clientid} search-date={searchdate}
                    selected-tab="tcm" group-code={groupcode} client-positions-type={filterValue} filter={searchValue}
                    group-name={groupname}>
                </c-dmt_-main-client-selection-table>
            </div>
        </div>
    </div>
</template>
