<template>
    <lightning-card>
        <div class="slds-m-around_medium">
            
            <c-dmt_-table-header-section
                titletable='BANKING POOL STRUCTURE'
                showcopypaste='false'
                context="derivatives"
            ></c-dmt_-table-header-section>

            <template lwc:if={isDataProcessed}>
                <div class="slds-table_edit_container">

                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_edit slds-table_fixed-layout" role="grid">

                        <thead>
                            <tr>
                                <th></th>
                                <th>Ticket (Mn)</th>
                                <th>Fees</th>
                                <th>Margin</th>
                                <th>Nº banks</th>
                            </tr>
                        </thead>

                        <tbody>
                            <template for:each={processedData} for:item="row">
                                <tr key={row.Id} class="slds-hint-parent">

                                    <!-- TIER -->
                                    <td data-label="Tier" role="gridcell">
                                        <div class="slds-grid slds-gutters cell-content">
                                            <div class="slds-col slds-size_3-of-3 cell-value tier-label">
                                                <span>{row.tierLabel}</span>
                                            </div>
                                        </div>
                                    </td>

                                    <!-- CELDAS DINÁMICAS -->
                                    <template for:each={row.values} for:item="cell">
                                        <td key={cell.field} data-label={cell.label} role="gridcell">

                                            <div class="slds-grid slds-gutters cell-content">

                                                <!-- MODO EDICIÓN -->
                                                <template lwc:if={cell.isEditing}>
                                                    <div class="slds-col slds-size_3-of-3">
                                                        <input 
                                                            type={cell.type}
                                                            class="slds-input"
                                                            value={cell.value}
                                                            data-index={row.index}
                                                            data-field={cell.field}
                                                            onchange={handleInputChange}
                                                        />
                                                    </div>
                                                </template>

                                                <!-- MODO LECTURA -->
                                                <template lwc:else>
                                                    
                                                    <div class="slds-col slds-size_2-of-3 cell-value">
                                                        <span title={cell.value}>{cell.value}</span>
                                                    </div>

                                                    <div class="slds-col slds-size_1-of-3">
                                                        <template lwc:if={cell.isEditable}>
                                                            <lightning-button-icon 
                                                                icon-name="utility:edit"
                                                                class="edit-icon no-border"
                                                                alternative-text="Edit"
                                                                data-id={row.Id}
                                                                data-field={cell.field}
                                                                onclick={handleEditCell}
                                                                variant="bare">
                                                            </lightning-button-icon>
                                                        </template>
                                                    </div>

                                                </template>

                                            </div>

                                        </td>
                                    </template>

                                </tr>
                            </template>
                        </tbody>

                    </table>

                </div>
            </template>

            <template lwc:else>
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </template>

        </div>
    </lightning-card>
</template>
