<template>
                <c-dmt_-table-header-section
                    titletable={labels.TITLE_TABLE}
                    showcopypaste="true"
                    rowscopypaste={tableData}
                    tablecolumnscopypaste={columnstablecopypaste}
                    context="singular"
                    isreadonlyuser={isReadOnlyUser}
                ></c-dmt_-table-header-section>
                <c-custom-data-table 
                key-field="Id" 
                style="position:relative"
                data={tableData} 
                columns={columns} 
                onpicklistchanged={picklistChanged} 
                oncustomselectrowchanged={selectedRowChanged} 
                draft-values={draftValues} 
                oncellchange={handleCellChange}
                onrowaction={handleRowAction}
                hide-checkbox-column
                suppress-bottom-bar
                show-row-number-column>
            </c-custom-data-table>
</template>
