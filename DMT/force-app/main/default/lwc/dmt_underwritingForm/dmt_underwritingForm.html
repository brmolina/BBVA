<template>
    <template if:true={hasGUMSProduct}>
        <lightning-card>
            <div class="slds-p-around_medium">

                <!-- Title -->
                <div class="slds-form-element slds-p-vertical_x-small">
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                        <div
                            class="slds-text-heading_medium slds-m-bottom_medium"
                            style="font-weight: bold;">
                            Global Underwriting Management System
                        </div>
                    </div>
                </div>

                <!-- Row: Underwriting + Deal Amount -->
                <div class="slds-grid slds-gutters">

                    <!-- Underwriting -->
                    <div class="slds-col slds-size_1-of-2">

                        <!-- Reading mode -->
                        <template if:false={isEditing}>
                            <div class="slds-form-element slds-border_bottom slds-p-vertical_x-small">
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">

                                    <div class="slds-grow">
                                        <label class="slds-form-element__label">
                                            Underwriting
                                        </label>

                                        <div class="slds-form-element__static">
                                            {underwritingValue}
                                        </div>
                                    </div>

                                    <lightning-button-icon
                                        class="inline-edit-pencil slds-shrink-none"
                                        icon-name="utility:edit"
                                        variant="bare"
                                        size="small"
                                        title="Editar"
                                        alternative-text="Editar"
                                        onclick={enterEditMode}>
                                    </lightning-button-icon>

                                </div>
                            </div>
                        </template>

                        <!-- Edit mode -->
                        <template if:true={isEditing}>
                            <div class="slds-p-vertical_x-small">
                                <lightning-combobox
                                    name="underwriting_agreement_type__c"
                                    label="Underwriting"
                                    value={underwritingValue}
                                    options={picklistOptions}
                                    onchange={handleUnderwritingChange}
                                    class="slds-size_full">
                                </lightning-combobox>
                            </div>
                        </template>

                    </div>

                    <!-- Deal Amount -->
                    <template if:true={showForm}>
                        <div class="slds-col slds-size_1-of-2">

                            <!-- Reading mode -->
                            <template if:false={isEditing}>
                                <div class="slds-form-element slds-border_bottom slds-p-vertical_x-small">
                                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">

                                        <div class="slds-grow">
                                            <label class="slds-form-element__label">
                                                {dealAmountLabel}
                                            </label>

                                            <div class="slds-form-element__static">
                                                {dealAmountValue}
                                            </div>
                                        </div>

                                    </div>
                                </div>
                            </template>

                            <!-- Edit mode -->
                            <template if:true={isEditing}>
                                <div class="slds-p-vertical_x-small">
                                    <lightning-input
                                        type="text"
                                        label={dealAmountLabel}
                                        value={dealAmountValue}
                                        disabled>
                                    </lightning-input>
                                </div>
                            </template>

                        </div>
                    </template>

                </div>

                <!-- Dynamic form -->
                <template if:true={showForm}>
                    <template for:each={rows} for:item="row">

                        <div
                            key={row.rowKey}
                            class="slds-grid slds-gutters">

                            <template for:each={row.fields} for:item="field">

                                <div
                                    key={field.apiName}
                                    class="slds-col slds-size_1-of-2">

                                    <!-- Reading mode -->
                                    <template if:false={isEditing}>
                                        <div class="slds-form-element slds-border_bottom slds-p-vertical_x-small">

                                            <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-end">

                                                <div class="slds-grow">
                                                    <label class="slds-form-element__label">
                                                        {field.label}
                                                    </label>

                                                    <!-- Textarea value -->
                                                    <template if:true={field.isTextarea}>
                                                        <div
                                                            class="slds-form-element__static"
                                                            style="white-space: pre-wrap;">
                                                            {field.value}
                                                        </div>
                                                    </template>

                                                    <!-- Non-textarea value -->
                                                    <template if:false={field.isTextarea}>

                                                        <!-- Percentage -->
                                                        <template if:true={field.isPercentage}>
                                                            <div class="slds-form-element__static">
                                                                {field.value}%
                                                            </div>
                                                        </template>

                                                        <!-- Normal value -->
                                                        <template if:false={field.isPercentage}>
                                                            <div class="slds-form-element__static">
                                                                {field.value}
                                                            </div>
                                                        </template>

                                                    </template>
                                                </div>

                                                <!-- Edit pencil -->
                                                <template if:false={field.readOnly}>
                                                    <lightning-button-icon
                                                        class="inline-edit-pencil slds-shrink-none"
                                                        icon-name="utility:edit"
                                                        variant="bare"
                                                        size="small"
                                                        title="Editar"
                                                        alternative-text="Editar"
                                                        onclick={enterEditMode}>
                                                    </lightning-button-icon>
                                                </template>

                                            </div>
                                        </div>
                                    </template>

                                    <!-- Edit mode -->
                                    <template if:true={isEditing}>

                                        <!-- Picklist -->
                                        <template if:true={field.isPicklist}>
                                            <lightning-combobox
                                                name={field.apiName}
                                                label={field.label}
                                                value={field.value}
                                                options={field.options}
                                                onchange={handleChange}
                                                disabled={field.readOnly}>
                                            </lightning-combobox>
                                        </template>

                                        <!-- Textarea -->
                                        <template if:true={field.isTextarea}>
                                            <lightning-textarea
                                                name={field.apiName}
                                                label={field.label}
                                                value={field.value}
                                                onchange={handleChange}
                                                disabled={field.readOnly}>
                                            </lightning-textarea>
                                        </template>

                                        <template if:false={field.isPicklist}>
                                            <template if:false={field.isTextarea}>

                                                <!-- Percentage input -->
                                                <template if:true={field.isPercentage}>
                                                    <div class="percentage-input">

                                                        <lightning-input
                                                            type="text"
                                                            inputmode="decimal"
                                                            name={field.apiName}
                                                            label={field.label}
                                                            value={field.value}
                                                            onchange={handleChange}
                                                            onkeydown={handlePercentageKeyDown}
                                                            disabled={field.readOnly}>
                                                        </lightning-input>

                                                        <span class="percentage-suffix">
                                                            %
                                                        </span>

                                                    </div>
                                                </template>

                                                <!-- Non-percentage input -->
                                                <template if:false={field.isPercentage}>

                                                    <!-- Preserve decimals -->
                                                    <template if:true={field.preserveDecimals}>
                                                        <lightning-input
                                                            type="text"
                                                            inputmode="decimal"
                                                            name={field.apiName}
                                                            label={field.label}
                                                            value={field.value}
                                                            onkeydown={handlePercentageKeyDown}
                                                            onchange={handleChange}
                                                            disabled={field.readOnly}>
                                                        </lightning-input>
                                                    </template>

                                                    <!-- Normal input -->
                                                    <template if:false={field.preserveDecimals}>
                                                        <lightning-input
                                                            type={field.type}
                                                            name={field.apiName}
                                                            label={field.label}
                                                            value={field.value}
                                                            step={field.step}
                                                            onchange={handleChange}
                                                            disabled={field.readOnly}>
                                                        </lightning-input>
                                                    </template>

                                                </template>
                                            </template>
                                        </template>

                                    </template>

                                </div>
                            </template>
                        </div>

                    </template>
                </template>

                <div class="slds-m-top_large"></div>

                <!-- Sold Orders -->
                <template if:true={showSoldOrdersTable}>
                    <lightning-accordion
                        active-section-name="soldOrders"
                        allow-multiple-sections-open>

                        <lightning-accordion-section
                            name="soldOrders"
                            label="Sold Orders">

                            <div class="uw-scope">
                                <c-custom-data-table
                                    data={tableData}
                                    style="max-height: 40vh;"
                                    columns={columns}
                                    key-field="Id"
                                    max-row-selection="0"
                                    hide-checkbox-column="true"
                                    onrowaction={handleRowAction}
                                    suppress-bottom-bar>
                                </c-custom-data-table>
                            </div>

                        </lightning-accordion-section>
                    </lightning-accordion>
                </template>

                <!-- Save and Cancel -->
                <template if:true={isEditing}>
                    <div
                        class="slds-m-top_medium slds-align_absolute-center"
                        style="position: relative;">

                        <template if:true={isSaving}>
                            <lightning-spinner
                                alternative-text="Saving..."
                                size="small"
                                style="position: relative;">
                            </lightning-spinner>
                        </template>

                        <template if:false={isSaving}>
                            <lightning-button
                                variant="neutral"
                                label="Cancel"
                                onclick={handleCancel}
                                class="slds-m-right_small">
                            </lightning-button>

                            <lightning-button
                                variant="brand"
                                label="Save"
                                onclick={handleSave}>
                            </lightning-button>
                        </template>

                    </div>
                </template>

            </div>
        </lightning-card>
    </template>
</template>
